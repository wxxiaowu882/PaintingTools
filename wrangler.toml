# soft-voice-f822 现网是 Workers 静态资源项目（不是 Pages）。
# 发版：先 pages functions build，再 wrangler deploy（见 docs/deploy.bat）。
name = "soft-voice-f822"
compatibility_date = "2024-10-01"
main = "./dist/worker/index.js"

[assets]
directory = "."
binding = "ASSETS"
# 默认先吐静态文件会绕过会员过滤；API 与课表 JSON 必须先走 Worker。
run_worker_first = ["/api/*", "/docs/json/*"]
# 与线上无后缀 URL 习惯对齐：/Solid → Solid.html
html_handling = "auto-trailing-slash"

# 发码记录本 + 网页保存收费设置
[[kv_namespaces]]
binding = "MEMBERSHIP_KV"
id = "e556d7993e374d31bc8d693a6273f337"
# 本机 wrangler dev 用预览库，避免本地试发码污染线上记录本
preview_id = "5d6b765a9da241e390799c24519d96b8"

# ---------- 测试站（独立 Worker + 独立 KV，勿与正式混用）----------
# 发版：docs/deploy-staging.bat → wrangler deploy --env staging
# Worker 名：soft-voice-f822-staging
# 国内访问请用自定义域名（workers.dev 在大陆常被干扰）
[env.staging]
name = "soft-voice-f822-staging"
workers_dev = true

[[env.staging.routes]]
pattern = "test.wuxiaoart.com"
custom_domain = true

[[env.staging.kv_namespaces]]
binding = "MEMBERSHIP_KV"
id = "050dc9b4fa834d27918dd32f54ecde09"
