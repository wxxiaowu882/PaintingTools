# soft-voice-f822 现网是 Workers 静态资源项目（不是 Pages）。
# 发版：先 pages functions build，再 wrangler deploy（见 docs/deploy.bat）。
name = "soft-voice-f822"
compatibility_date = "2024-10-01"
main = "./dist/worker/index.js"

[assets]
directory = "."
binding = "ASSETS"
# 默认先吐静态文件会绕过会员过滤；API 与课表 JSON 必须先走 Worker。
# /CourseLearn*：正式站由 _middleware 拦成「筹备中」，测站/本地仍出完整 demo（见路线图 §4.5.2）
run_worker_first = ["/api/*", "/docs/json/*", "/CourseLearn", "/CourseLearn/", "/CourseLearn.html"]
# 与线上无后缀 URL 习惯对齐：/Solid → Solid.html
html_handling = "auto-trailing-slash"

# 发码记录本 + 网页保存收费设置
[[kv_namespaces]]
binding = "MEMBERSHIP_KV"
id = "e556d7993e374d31bc8d693a6273f337"
# 本机 wrangler dev 用预览库，避免本地试发码污染线上记录本
preview_id = "5d6b765a9da241e390799c24519d96b8"

# ---------- 测试站（独立 Worker + 独立 KV，勿与正式混用）----------
# 发版：docs/deploy-staging.bat → wrangler deploy --env staging
# Worker 名：soft-voice-f822-staging
# 国内访问请用自定义域名（workers.dev 在大陆常被干扰）
[env.staging]
name = "soft-voice-f822-staging"
workers_dev = true

# 测站专用：全量 Worker-first，才能用 _middleware 禁收录（覆盖 robots + HTML 头）。
# 正式站保持上面选择性 run_worker_first，勿把 true 抄到 prod（占免费 Worker 次数）。
[env.staging.assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"

[[env.staging.routes]]
pattern = "test.wuxiaoart.com"
custom_domain = true

[[env.staging.kv_namespaces]]
binding = "MEMBERSHIP_KV"
id = "050dc9b4fa834d27918dd32f54ecde09"

# ---------- 正课 R2 短时签名（C3）----------
# play-url 用 S3 API Token 签 GET，不靠 R2 binding。
# 测站已冒烟（2026-11-03）：桶 wuxiao-course-staging；Secrets 已 put --env staging；
# 探针 lessonId=smoke-land → source:r2。正式站仍未配。
# 启用正式站时再：
# 1) 另建正式私有桶（勿与 staging 混用）
# 2) 建 R2 API Token（Object Read，限正式桶）
# 3) wrangler secret put COURSE_R2_* （正式环境，勿加 staging）
# 4) 桶 CORS：允许 https://www.wuxiaoart.com（及测站域若需）GET/HEAD，
#    AllowedHeaders 含 Range / Content-Type；暴露 Accept-Ranges / Content-Range / Content-Length
# 可选 var：COURSE_R2_TTL_SEC=600 ；COURSE_LESSON_KEY_JSON='{"71":"course/71/v1/main.mp4"}'
# 未配齐 Secrets 时：/api/course/play-url 对 demo/测站走本地样片路径，正式站返回 not_ready。
# demo* lessonId 始终强制本地样片，不走 R2。
