        + String(d.getHours()).padStart(2, '0')

const copyModelToHistoryFolder = async (model, forcedTargetId = null) => {
    if (!model || !model.handle) {
        logDebug('⚠️ 无法复制：模型句柄无效');
        return null;
    }
    const others = dirHistory.filter((d) => d.id !== currentDirHistoryId);
    if (!others.length && !forcedTargetId) {
        alert('当前只有一个历史文件夹。请先用「新文件夹」再加载一个目标目录，才能复制过去。');
        return null;
    }
    const targetId = forcedTargetId || await pickCopyTargetHistoryId(model.fullPath || model.name);
    if (!targetId) return null;
    if (targetId === currentDirHistoryId) {
        alert('请选择与当前不同的历史文件夹。');
        return null;
    }
    const entry = dirHistory.find((d) => d.id === targetId);
    if (!entry) {
        logDebug('⚠️ 目标历史文件夹不存在');
        return null;
    }
    try {
        const targetHandle = await ensureHistoryHandle(entry);
        if (!targetHandle) {
            alert('未获得目标文件夹写权限，复制已取消。');
            return null;
        }
        const srcFile = await model.handle.getFile();
        const buffer = await srcFile.arrayBuffer();
        let finalName = model.name;
        if (!/\.glb$/i.test(finalName)) finalName += '.glb';
        if (await fileExistsInDir(targetHandle, finalName)) {
            const ts = makeGlbTimestampSuffix();
            finalName = finalName.replace(/\.glb$/i, `_${ts}.glb`);
            logDebug(`⚠️ 目标文件夹已有同名文件，自动追加后缀 -> ${finalName}`);
        }
        const newHandle = await targetHandle.getFileHandle(finalName, { create: true });
        const writable = await newHandle.createWritable();
        await writable.write(buffer);
        await writable.close();
        entry.lastUsed = Date.now();
        await persistDirHistory();
        const label = displayDirLabel(entry);
        logDebug(`✅ 已复制到历史文件夹「${label}」: ${finalName}`);
        const st = document.getElementById('status-text');
        if (st) st.innerText = `已复制到「${label}」· ${finalName}`;
        return { targetId, finalName, label };
    } catch (err) {
        logDebug('❌ 复制失败', err);
        alert('复制失败: ' + (err && err.message ? err.message : String(err)));
        return null;
    }
};

const fsApiFetch = async (pathSuffix, init) => {

            if (!res.ok) {

const makeServerFileHandle = (absRoot, relPath) => {
    const name = relPath.includes('/') ? relPath.slice(relPath.lastIndexOf('/') + 1) : relPath;
    const fileHandle = {
        kind: 'file',
        name,
        __serverAbsRoot: absRoot,
        __serverRel: String(relPath || '').replace(/\\/g, '/'),
        getFile: async () => {
            const res = await fsApiFetch('/__api/fs/read', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ root: absRoot, rel: fileHandle.__serverRel }),
            });
            const buf = await res.arrayBuffer();
            const mtime = Number(res.headers.get('X-Glb-Mtime')) || Date.now();
            return new File([buf], name, { type: 'model/gltf-binary', lastModified: mtime });
        },
        createWritable: async () => {
            const chunks = [];
            return {
                write: async (data) => { chunks.push(data); },
                close: async () => {
                    const blob = new Blob(chunks);
                    const ab = await blob.arrayBuffer();
                    await fsApiFetch('/__api/fs/write', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/octet-stream',
                            'X-Glb-Root': encodeURIComponent(absRoot),
                            'X-Glb-Rel': encodeURIComponent(fileHandle.__serverRel),
                        },
                        body: ab,
                    });
                },
            };
        },
    };
    return fileHandle;
};
const makeServerDirHandle = (absRoot, relDir = '') => {
    const normRel = String(relDir || '').replace(/\\/g, '/').replace(/^\/+|\/+$/g, '');
    return {
        kind: 'directory',
        name: normRel ? normRel.slice(normRel.lastIndexOf('/') + 1) : basenameFromPath(absRoot),
        __serverAbsRoot: absRoot,
        __serverRelDir: normRel,
        queryPermission: async () => 'granted',
        requestPermission: async () => 'granted',
        isSameEntry: async (other) => !!(other && other.__serverAbsRoot === absRoot && (other.__serverRelDir || '') === normRel),
        values: async function* () {},
        getFileHandle: async (n) => {
            const childRel = normRel ? `${normRel}/${n}` : n;
            return makeServerFileHandle(absRoot, childRel);
        },
        getDirectoryHandle: async (n) => makeServerDirHandle(absRoot, normRel ? `${normRel}/${n}` : n),
        removeEntry: async (n) => {
            const childRel = normRel ? `${normRel}/${n}` : n;
            await fsApiFetch('/__api/fs/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ root: absRoot, rel: childRel }),
            });
        },
    };
};

/**

const ensureCurrentAbsRoot = async (opts = {}) => {

    if (opts.absRoot && isWindowsAbsPath(opts.absRoot)) {

    await probeLocalFsApi();
    if (!localFsApiReady) {
        alert('无法绑定完整路径：请用 Portal「01_Glb管理器.bat」打开本工具（需本机 18080）。');
        return null;
    }
    const folderName = (getCurrentHistoryEntry() && getCurrentHistoryEntry().name)
        || (currentDirHandle && currentDirHandle.name)
        || '当前文件夹';
    const st = document.getElementById('status-text');
    // 浏览器能读文件内容，但故意不把 E:\ 盘符告诉网页；只能靠本机 18080 记一次

    logDebug(`📂 缺少完整路径（浏览器安全限制），弹出系统选目录以绑定「${folderName}」…`);

            + '请确认 Portal「01_Glb管理器.bat」/ 18080 在运行，以便本机帮你记住路径。'
        );
        return null;
    }
    if (!picked) {
        if (st) st.innerText = '已取消路径绑定';
        logDebug('ℹ️ 用户取消了路径绑定');
        return null;
    }
    const pickedName = basenameFromPath(picked);
    if (pickedName && folderName && !folderNameLooseEq(pickedName, folderName)) {
        const ok = confirm(
            `所选是「${pickedName}」，当前列表是「${folderName}」。\n`

            return null;
        }
    }
    await attachAbsPathToCurrent(picked);
    if (st) st.innerText = `已记住路径 · ${picked}`;
    logDebug(`✅ 已绑定完整路径: ${picked}`);
    return picked;

/** 用手术台真实包围盒构图，只借用 model-viewer 的方位角，避免投影与所见错位 */
const getProcessingSceneWorldBoxFast = (out = new THREE.Box3()) => {
    out.makeEmpty();
    if (!processingScene) return out;
    processingScene.scene.updateMatrixWorld(true);
    const tmp = new THREE.Box3();
    processingScene.scene.traverse(node => {
        if (!node.isMesh || !node.geometry) return;
        const geo = node.geometry;
        if (!geo.boundingBox) geo.computeBoundingBox();
        if (!geo.boundingBox) return;
        tmp.copy(geo.boundingBox).applyMatrix4(node.matrixWorld);
        out.union(tmp);
    });
    return out;
};

const syncSplitCameraFromModelViewer = () => {
    if (!splitCamera || !processingScene) return;
    let theta = Math.PI / 4, phi = Math.PI * 75 / 180;
    if (typeof mainViewer.getCameraOrbit === 'function') {
        try {
            const orbit = mainViewer.getCameraOrbit();
            if (orbit && isFinite(orbit.theta) && isFinite(orbit.phi)) {
                theta = Number(orbit.theta);
                phi = Number(orbit.phi);
            }
        } catch (_) {}
    }
    let fov = 20;
    const fovAttr = mainViewer.getAttribute('field-of-view');
    if (fovAttr) {
        const m = String(fovAttr).match(/([\d.]+)/);
        if (m) fov = parseFloat(m[1]);
    }
    splitCamera.fov = fov;
    const box = getProcessingSceneWorldBoxFast();
    const center = new THREE.Vector3();
    const size = new THREE.Vector3();
    box.getCenter(center);
    box.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z, 0.01);
    const fovRad = THREE.MathUtils?.degToRad ? THREE.MathUtils.degToRad(fov) : (fov * Math.PI / 180);
    const radius = (maxDim / (2 * Math.tan(fovRad / 2))) * 1.35;
    splitCamera.position.set(
        center.x + radius * Math.sin(phi) * Math.sin(theta),
        center.y + radius * Math.cos(phi),
        center.z + radius * Math.sin(phi) * Math.cos(theta)
    );
    splitCamera.near = Math.max(maxDim * 0.001, 0.001);
    splitCamera.far = Math.max(maxDim * 100, 100);
    splitCamera.lookAt(center);
    splitCamera.updateProjectionMatrix();
    splitCamera.updateMatrixWorld(true);
};

/** 面数超过此阈值不再做连通块拆分（整 mesh 算一件），避免高模并查集卡死主线程 */
const SPLIT_ISLAND_TRI_LIMIT = 12000;
/** 连通块过多视为碎片噪声，整 mesh 当一件（否则框选要投影/高亮上千件） */
const SPLIT_ISLAND_COUNT_LIMIT = 48;

const geometryTriCount = (geometry) => {
    const pos = geometry && geometry.attributes && geometry.attributes.position;
    if (!pos || pos.count < 3) return 0;
    if (geometry.index) return Math.floor(geometry.index.count / 3);
    return Math.floor(pos.count / 3);
};

/** 将 BufferGeometry 按三角面连通块拆分（不相连的「孤岛」各算一件） */
const analyzeGeometryIslands = (geometry) => {
    const pos = geometry && geometry.attributes && geometry.attributes.position;
    if (!pos || pos.count < 3) return [{ triIndices: null, triSet: null, localBox: null }];
    const indexed = !!geometry.index;
    const idx = indexed ? geometry.index.array : null;
    const triCount = indexed ? Math.floor(idx.length / 3) : Math.floor(pos.count / 3);
    if (triCount <= 1) return [{ triIndices: null, triSet: null, localBox: null }];
    // 高模：跳过孤岛分析（解剖包等多 mesh 场景本身已按件拆开）
    if (triCount > SPLIT_ISLAND_TRI_LIMIT) {
        return [{ triIndices: null, triSet: null, localBox: null, skippedHeavy: true, triCount }];
    }

    const keyToCanon = new Map();
    let canonCount = 0;
    const canonOfVertex = (vi) => {
        if (indexed) return vi;
        const key = pos.getX(vi).toFixed(5) + ',' + pos.getY(vi).toFixed(5) + ',' + pos.getZ(vi).toFixed(5);
        let id = keyToCanon.get(key);
        if (id === undefined) { id = canonCount++; keyToCanon.set(key, id); }
        return id;
    };
    const triCanon = (t) => {
        if (indexed) return [idx[t * 3], idx[t * 3 + 1], idx[t * 3 + 2]];
        return [canonOfVertex(t * 3), canonOfVertex(t * 3 + 1), canonOfVertex(t * 3 + 2)];
    };
    // 先扫一遍非索引以填满 canon（非索引时 canonOfVertex 会增长）
    if (!indexed) {
        for (let t = 0; t < triCount; t++) triCanon(t);
    }
    const parent = new Int32Array(indexed ? pos.count : canonCount);
    for (let i = 0; i < parent.length; i++) parent[i] = i;
    const find = (a) => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
    const unite = (a, b) => { a = find(a); b = find(b); if (a !== b) parent[b] = a; };

    for (let t = 0; t < triCount; t++) {
        const [a, b, c] = triCanon(t);
        unite(a, b); unite(b, c);
    }
    const rootToTris = new Map();
    for (let t = 0; t < triCount; t++) {
        const root = find(triCanon(t)[0]);
        if (!rootToTris.has(root)) rootToTris.set(root, []);
        rootToTris.get(root).push(t);
    }
    const islands = Array.from(rootToTris.values());
    if (islands.length <= 1) return [{ triIndices: null, triSet: null, localBox: null }];
    if (islands.length > SPLIT_ISLAND_COUNT_LIMIT) {
        return [{
            triIndices: null,
            triSet: null,
            localBox: null,
            skippedFragmented: true,
            islandCount: islands.length,
            triCount
        }];
    }
    return islands.map(tris => ({
        triIndices: tris,
        triSet: new Set(tris),
        localBox: null
    }));
};

const islandLocalBounds = (geometry, triIndices, cacheHost) => {
    if (cacheHost && cacheHost.localBox) return cacheHost.localBox.clone();
    const box = new THREE.Box3();
    const pos = geometry.attributes.position;
    const idx = geometry.index ? geometry.index.array : null;
    const v = new THREE.Vector3();
    for (let i = 0; i < triIndices.length; i++) {
        const t = triIndices[i];
        for (let k = 0; k < 3; k++) {
            const vi = idx ? idx[t * 3 + k] : (t * 3 + k);
            v.fromBufferAttribute(pos, vi);
            box.expandByPoint(v);
        }
    }
    if (cacheHost) cacheHost.localBox = box.clone();
    return box;
};

const extractIslandGeometry = (geometry, triIndices) => {
    const srcPos = geometry.attributes.position;
    const srcNorm = geometry.attributes.normal;
    const srcUv = geometry.attributes.uv;
    const idx = geometry.index ? geometry.index.array : null;
    const positions = [];
    const normals = [];
    const uvs = [];
    const mapOldToNew = new Map();
    const indices = [];
    const readVert = (vi) => {
        if (mapOldToNew.has(vi)) return mapOldToNew.get(vi);
        const ni = positions.length / 3;
        positions.push(srcPos.getX(vi), srcPos.getY(vi), srcPos.getZ(vi));
        if (srcNorm) normals.push(srcNorm.getX(vi), srcNorm.getY(vi), srcNorm.getZ(vi));
        if (srcUv) uvs.push(srcUv.getX(vi), srcUv.getY(vi));
        mapOldToNew.set(vi, ni);
        return ni;
    };
    for (let i = 0; i < triIndices.length; i++) {
        const t = triIndices[i];
        for (let k = 0; k < 3; k++) {
            const vi = idx ? idx[t * 3 + k] : (t * 3 + k);
            indices.push(readVert(vi));
        }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    if (normals.length) geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    else geo.computeVertexNormals();
    if (uvs.length) geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeBoundingBox();
    geo.computeBoundingSphere();
    return geo;
};

const collectSelectableParts = () => {
    const parts = [];
    if (!processingScene) return parts;
    let meshIdx = 0;
    processingScene.scene.traverse(node => {
        if (!node.isMesh || !node.geometry) return;
        if (!node.userData._splitIslandCache) {
            node.userData._splitIslandCache = analyzeGeometryIslands(node.geometry);
        }
        const islands = node.userData._splitIslandCache;
        if (islands.length === 1 && islands[0].triIndices === null) {
            parts.push({
                id: `m${meshIdx}`,
                mesh: node,
                triIndices: null,
                triSet: null,
                islandMeta: islands[0]
            });
        } else {
            islands.forEach((isl, j) => {
                parts.push({
                    id: `m${meshIdx}_i${j}`,
                    mesh: node,
                    triIndices: isl.triIndices,
                    triSet: isl.triSet || (isl.triIndices ? new Set(isl.triIndices) : null),
                    islandMeta: isl
                });
            });
        }
        meshIdx++;
    });
    return parts;
};

const partLocalBox = (part) => {
    if (!part.triIndices) return null;
    return islandLocalBounds(part.mesh.geometry, part.triIndices, part.islandMeta);
};

const partWorldBox = (part, out = new THREE.Box3()) => {
    part.mesh.updateMatrixWorld(true);
    if (!part.triIndices) {
        const geo = part.mesh.geometry;
        if (!geo.boundingBox) geo.computeBoundingBox();
        // 禁止 setFromObject：高模会扫全部顶点，框选必卡
        out.copy(geo.boundingBox).applyMatrix4(part.mesh.matrixWorld);
        return out;
    }
    out.copy(partLocalBox(part)).applyMatrix4(part.mesh.matrixWorld);
    return out;
};

const partCenterWorld = (part, out = new THREE.Vector3()) => {
    partWorldBox(part, splitBoxHelper);
    splitBoxHelper.getCenter(out);
    return out;
};

const makeHighlightMaterial = () => new THREE.MeshStandardMaterial({
    color: 0x2ec8ff,
    emissive: 0x0099bb,
    emissiveIntensity: 0.55,
    roughness: 0.4,
    metalness: 0.05,
    side: THREE.DoubleSide
});

/** 分色/平涂 atlas：关 mipmap + NEAREST；并压低环境光对比，避免低模棱面被看成「黑三角 fleck」。 */
const hardenColorMaps = (root) => {
    if (!root) return;
    root.traverse((node) => {
        if (!node.isMesh || !node.material) return;
        const mats = Array.isArray(node.material) ? node.material : [node.material];
        mats.forEach((m) => {
            if (!m) return;
            if (m.map) {
                m.map.generateMipmaps = false;
                m.map.minFilter = THREE.NearestFilter;
                m.map.magFilter = THREE.NearestFilter;
                if ('wrapS' in m.map) {
                    m.map.wrapS = THREE.ClampToEdgeWrapping;
                    m.map.wrapT = THREE.ClampToEdgeWrapping;
                }
                m.map.needsUpdate = true;
            }
            if (m.isMeshStandardMaterial || m.isMeshPhysicalMaterial) {
                // 教学平涂：少一点 IBL 棱面明暗，观感更接近「色块」而不是「碎三角」
                if ('envMapIntensity' in m) m.envMapIntensity = 0.2;
                if (m.userData && m.userData.origRoughness === undefined) {
                    m.userData.origRoughness = (m.roughness !== undefined && !isNaN(m.roughness)) ? m.roughness : 0.5;
                }
                m.roughness = Math.max(0.85, m.roughness || 0.5);
                m.metalness = 0.0;
                m.needsUpdate = true;
            }
        });
    });
};

/**
 * 导出体积限制：GLTFExporter 的 maxTextureSize 是线性缩小，分色平涂会串成 fleck。
 * 先用最近邻缩到上限，再让 exporter 不再二次缩小。
 */
const nearestResizeMapsForExport = (root, maxSize) => {
    if (!root || !(maxSize > 0)) return 0;
    let n = 0;
    root.traverse((node) => {
        if (!node.isMesh || !node.material) return;
        const mats = Array.isArray(node.material) ? node.material : [node.material];
        mats.forEach((m) => {
            const tex = m && m.map;
            const img = tex && tex.image;
            if (!img || !img.width || !img.height) return;
            const w = img.width;
            const h = img.height;
            if (w <= maxSize && h <= maxSize) return;
            const scale = maxSize / Math.max(w, h);
            const nw = Math.max(1, Math.round(w * scale));
            const nh = Math.max(1, Math.round(h * scale));
            const cvs = document.createElement('canvas');
            cvs.width = nw;
            cvs.height = nh;
            const ctx = cvs.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(img, 0, 0, nw, nh);
            tex.image = cvs;
            tex.generateMipmaps = false;
            tex.minFilter = THREE.NearestFilter;
            tex.magFilter = THREE.NearestFilter;
            tex.needsUpdate = true;
            n++;
        });
    });
    return n;
};

const applySplitHighlights = (parts) => {
    clearSplitHighlights();
    // 同 mesh 多孤岛被一起选中时，整模着色即可，避免生成成百上千个 helper
    const byMesh = new Map();
    parts.forEach(part => {
        if (!byMesh.has(part.mesh)) byMesh.set(part.mesh, []);
        byMesh.get(part.mesh).push(part);
    });
    const coalesced = [];
    byMesh.forEach((list, mesh) => {
        const islandBits = list.filter(p => p.triIndices);
        if (islandBits.length >= 2) {
            coalesced.push({ id: list[0].id, mesh, triIndices: null, triSet: null, islandMeta: null });
        } else {
            list.forEach(p => coalesced.push(p));
        }
    });
    splitSelectedParts = parts;
    splitSelectedMeshes = parts.map(p => p.mesh);
    const wholeMeshTinted = new Set();
    const worldBox = new THREE.Box3();
    coalesced.forEach(part => {
        const mesh = part.mesh;
        if (part.triIndices) {
            try {
                if (typeof THREE.Box3Helper === 'function') {
                    const helper = new THREE.Box3Helper(partLocalBox(part), 0x00d2ff);
                    helper.name = 'SplitSelectBoxHelper';
                    mesh.add(helper);
                    splitHighlightHelpers.push(helper);
                }
            } catch (err) {
                logDebug('⚠️ 孤岛高亮失败', err);
            }
        } else if (!wholeMeshTinted.has(mesh)) {
            wholeMeshTinted.add(mesh);
            if (mesh.userData._splitOrigMaterial === undefined) {
                mesh.userData._splitOrigMaterial = mesh.material;
                mesh.material = makeHighlightMaterial();
            }
            try {
                partWorldBox(part, worldBox);
                if (typeof THREE.Box3Helper === 'function') {
                    const helper = new THREE.Box3Helper(worldBox.clone(), 0x00d2ff);
                    helper.name = 'SplitSelectBoxHelper';
                    splitSceneRoot.add(helper);
                    splitHighlightHelpers.push(helper);
                }
            } catch (_) {}
        }
    });
    updateSplitExportBtn();
};

const stopSplitRenderLoop = () => {
    if (splitRafId) { cancelAnimationFrame(splitRafId); splitRafId = 0; }
};

const renderSplitFrame = () => {
    if (!isBoxSelectMode || !splitRenderer || !processingScene) { splitRafId = 0; return; }
    // 不再每帧 BoxHelper.update（高模 setFromObject 会卡死）
    splitRenderer.render(splitSceneRoot, splitCamera);
    splitRafId = requestAnimationFrame(renderSplitFrame);
};

const attachSplitSceneContent = () => {
    if (!processingScene || !splitSceneRoot) return;
    while (splitSceneRoot.children.length) splitSceneRoot.remove(splitSceneRoot.children[0]);
    splitSceneRoot.add(splitLights);
    splitSceneRoot.add(processingScene.scene);
    const helpers = createHelpers();
    if (helpers) splitSceneRoot.add(helpers);
};

const collectSceneMeshes = () => {
    const list = [];
    if (!processingScene) return list;
    processingScene.scene.traverse(node => { if (node.isMesh) list.push(node); });
    return list;
};

const exitBoxSelectMode = (opts = {}) => {
    const { keepModeBtn = false } = opts;
    stopSplitRenderLoop();
    clearSplitHighlights();
    splitDrag = null;
    splitMarquee.style.display = 'none';
    splitCanvas.style.display = 'none';
    mainViewer.style.pointerEvents = '';
    isBoxSelectMode = false;
    if (!keepModeBtn) {
        btnViewMode.classList.remove('is-box');
        btnViewMode.innerText = '🖱️ 当前: 旋转';
    }
};

const enterBoxSelectMode = () => {
    if (!processingScene) { logDebug('⚠️ 尚未载入模型，无法进入框选'); return; }
    ensureSplitRenderer();
    // 孤岛缓存随几何保留；换模时 resetSplitSelectState / 新 scene 自然失效，勿每次进入重算
    attachSplitSceneContent();
    splitCanvas.style.display = 'block';
    mainViewer.style.pointerEvents = 'none';
    isBoxSelectMode = true;
    resizeSplitRenderer();
    syncSplitCameraFromModelViewer();
    btnViewMode.classList.add('is-box');
    btnViewMode.innerText = '📦 当前: 框选';
    stopSplitRenderLoop();
    renderSplitFrame();
    const meshN = collectSceneMeshes().length;
    const t0 = performance.now();
    const parts = collectSelectableParts();
    const ms = Math.round(performance.now() - t0);
    const heavySkip = parts.filter(p => p.islandMeta && (p.islandMeta.skippedHeavy || p.islandMeta.skippedFragmented)).length;
    logDebug(`📦 已进入框选模式（mesh=${meshN}，可选件=${parts.length}，整件跳过(重模/碎片)=${heavySkip}，分析 ${ms}ms）`);
};

const setViewModeRotate = () => {
    if (!isBoxSelectMode) return;
    exitBoxSelectMode();
    logDebug('🖱️ 已切回旋转模式');
};

const setViewModeBox = () => {
    enterBoxSelectMode();
};

btnViewMode.onclick = () => {
    if (!processingScene) { logDebug('⚠️ 请先选择模型'); return; }
    if (isBoxSelectMode) setViewModeRotate();
    else setViewModeBox();
};

const canvasPointFromEvent = (e) => {
    const rect = getMainViewRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top, w: rect.width, h: rect.height };
};

const updateMarqueeDom = () => {
    if (!splitDrag) { splitMarquee.style.display = 'none'; return; }
    const x = Math.min(splitDrag.x0, splitDrag.x1);
    const y = Math.min(splitDrag.y0, splitDrag.y1);
    const w = Math.abs(splitDrag.x1 - splitDrag.x0);
    const h = Math.abs(splitDrag.y1 - splitDrag.y0);
    splitMarquee.style.display = 'block';
    splitMarquee.style.left = x + 'px';
    splitMarquee.style.top = y + 'px';
    splitMarquee.style.width = w + 'px';
    splitMarquee.style.height = h + 'px';
};

const projectWorldBoxToScreen = (worldBox, cw, ch) => {
    const min = worldBox.min;
    const max = worldBox.max;
    let sxMin = Infinity, sxMax = -Infinity, syMin = Infinity, syMax = -Infinity;
    let any = false;
    for (let ix = 0; ix < 2; ix++) {
        for (let iy = 0; iy < 2; iy++) {
            for (let iz = 0; iz < 2; iz++) {
                splitNdcHelper.set(
                    ix ? max.x : min.x,
                    iy ? max.y : min.y,
                    iz ? max.z : min.z
                ).project(splitCamera);
                if (splitNdcHelper.z > 1) continue;
                const sx = (splitNdcHelper.x * 0.5 + 0.5) * cw;
                const sy = (-splitNdcHelper.y * 0.5 + 0.5) * ch;
                sxMin = Math.min(sxMin, sx);
                sxMax = Math.max(sxMax, sx);
                syMin = Math.min(syMin, sy);
                syMax = Math.max(syMax, sy);
                any = true;
            }
        }
    }
    if (!any) return null;
    return { sxMin, sxMax, syMin, syMax };
};

const rectsIntersect = (aMinX, aMinY, aMaxX, aMaxY, bMinX, bMinY, bMaxX, bMaxY) =>
    aMaxX >= bMinX && aMinX <= bMaxX && aMaxY >= bMinY && aMinY <= bMaxY;

/** 优先：包围盒屏幕投影与框相交（高模友好，避免中心偏出框外） */
const pickPartsByBoundsInRect = (xMin, yMin, xMax, yMax, cw, ch) => {
    const parts = collectSelectableParts();
    const picked = [];
    const projections = [];
    const worldBox = new THREE.Box3();
    parts.forEach(part => {
        partWorldBox(part, worldBox);
        const proj = projectWorldBoxToScreen(worldBox, cw, ch);
        if (!proj) return;
        projections.push({
            id: part.id,
            sx: ((proj.sxMin + proj.sxMax) * 0.5).toFixed(1),
            sy: ((proj.syMin + proj.syMax) * 0.5).toFixed(1)
        });
        if (rectsIntersect(proj.sxMin, proj.syMin, proj.sxMax, proj.syMax, xMin, yMin, xMax, yMax)) {
            picked.push(part);
        }
    });
    return { picked, parts, projections };
};

const pickPartsByCenterInRect = (xMin, yMin, xMax, yMax, cw, ch) => {
    const parts = collectSelectableParts();
    const picked = [];
    const projections = [];
    parts.forEach(part => {
        partCenterWorld(part, splitCenterHelper);
        splitNdcHelper.copy(splitCenterHelper).project(splitCamera);
        if (splitNdcHelper.z > 1) return;
        const sx = (splitNdcHelper.x * 0.5 + 0.5) * cw;
        const sy = (-splitNdcHelper.y * 0.5 + 0.5) * ch;
        projections.push({ id: part.id, sx: sx.toFixed(1), sy: sy.toFixed(1) });
        if (sx >= xMin && sx <= xMax && sy >= yMin && sy <= yMax) picked.push(part);
    });
    return { picked, parts, projections };
};

const faceTriangleIndexFromHit = (hit) => {
    if (hit.faceIndex !== undefined && hit.faceIndex !== null) return hit.faceIndex;
    return null;
};

const pickPartsByRaySampleInRect = (xMin, yMin, xMax, yMax, cw, ch) => {
    if (!splitRaycaster) return [];
    const parts = collectSelectableParts();
    // 仅对「含孤岛」的 mesh 采样；整件 mesh 由包围盒路径处理
    const islandParts = parts.filter(p => p.triIndices);
    if (!islandParts.length) return [];
    const meshes = [];
    const byMesh = new Map();
    islandParts.forEach(p => {
        if (!byMesh.has(p.mesh)) {
            byMesh.set(p.mesh, []);
            meshes.push(p.mesh);
        }
        byMesh.get(p.mesh).push(p);
    });
    // 再筛：屏幕 AABB 与框相交的 mesh 才射线
    const worldBox = new THREE.Box3();
    const candidateMeshes = meshes.filter(mesh => {
        const geo = mesh.geometry;
        if (!geo.boundingBox) geo.computeBoundingBox();
        worldBox.copy(geo.boundingBox).applyMatrix4(mesh.matrixWorld);
        const proj = projectWorldBoxToScreen(worldBox, cw, ch);
        if (!proj) return false;
        return rectsIntersect(proj.sxMin, proj.syMin, proj.sxMax, proj.syMax, xMin, yMin, xMax, yMax);
    });
    if (!candidateMeshes.length) return [];

    const hitSet = new Set();
    const spanX = Math.max(1, xMax - xMin);
    const spanY = Math.max(1, yMax - yMin);
    const stepX = Math.max(spanX / 3, Math.min(64, spanX));
    const stepY = Math.max(spanY / 3, Math.min(64, spanY));
    for (let y = yMin; y <= yMax + 0.5; y += stepY) {
        for (let x = xMin; x <= xMax + 0.5; x += stepX) {
            const ndcX = (x / cw) * 2 - 1;
            const ndcY = -(y / ch) * 2 + 1;
            splitRaycaster.setFromCamera({ x: ndcX, y: ndcY }, splitCamera);
            const hits = splitRaycaster.intersectObjects(candidateMeshes, false);
            for (let i = 0; i < hits.length; i++) {
                const hit = hits[i];
                const candidates = byMesh.get(hit.object) || [];
                if (!candidates.length) continue;
                const tri = faceTriangleIndexFromHit(hit);
                if (tri === null) { hitSet.add(candidates[0]); continue; }
                const matched = candidates.find(p => {
                    if (p.triSet) return p.triSet.has(tri);
                    return p.triIndices && p.triIndices.indexOf(tri) !== -1;
                });
                if (matched) hitSet.add(matched);
            }
        }
    }
    return Array.from(hitSet);
};

const settleBoxSelection = (drag = splitDrag) => {
    if (!processingScene || !drag || !splitCamera) return { ok: false, picked: 0, ms: 0, method: '' };
    const t0 = performance.now();
    const marks = {};
    const mark = (k) => { marks[k] = Math.round(performance.now() - t0); };
    const xMin = Math.min(drag.x0, drag.x1);
    const xMax = Math.max(drag.x0, drag.x1);
    const yMin = Math.min(drag.y0, drag.y1);
    const yMax = Math.max(drag.y0, drag.y1);
    const w = xMax - xMin;
    const h = yMax - yMin;
    if (w < 3 || h < 3) {
        clearSplitHighlights();
        logDebug('ℹ️ 框选过小，已清空选中');
        return { ok: true, picked: 0, ms: Math.round(performance.now() - t0), method: 'too-small', marks };
    }
    const rect = getMainViewRect();
    const cw = rect.width || 1;
    const ch = rect.height || 1;
    resizeSplitRenderer();
    mark('resize');
    syncSplitCameraFromModelViewer();
    mark('syncCam');
    processingScene.scene.updateMatrixWorld(true);
    mark('updateMW');
    let { picked, parts, projections } = pickPartsByBoundsInRect(xMin, yMin, xMax, yMax, cw, ch);
    mark('bounds');
    let method = 'bounds';
    if (!picked.length && parts.length) {
        const centerHit = pickPartsByCenterInRect(xMin, yMin, xMax, yMax, cw, ch);
        mark('center');
        if (centerHit.picked.length) {
            picked = centerHit.picked;
            projections = centerHit.projections;
            method = 'center';
        }
    }
    // 射线兜底只服务「同 mesh 多孤岛」细分；整 mesh 高模场景包围盒已够，再射线会卡死
    if (!picked.length && parts.some(p => p.triIndices)) {
        picked = pickPartsByRaySampleInRect(xMin, yMin, xMax, yMax, cw, ch);
        mark('ray');
        method = 'ray-sample';
    } else if (!picked.length) {
        method = method === 'bounds' ? 'bounds-empty' : method;
    }
    applySplitHighlights(picked);
    mark('highlight');
    const ms = Math.round(performance.now() - t0);
    logDebug(`✅ 框选完成[${method}]：选中 ${picked.length} / ${parts.length} 个可拆件；耗时 ${ms}ms；框=(${xMin.toFixed(0)},${yMin.toFixed(0)})-(${xMax.toFixed(0)},${yMax.toFixed(0)})`);
    if (!picked.length && projections.length) {
        logDebug(`排查 各件投影中心: ${projections.map(p => `${p.id}@(${p.sx},${p.sy})`).join(' | ')}`);
    }
    return { ok: true, picked: picked.length, parts: parts.length, ms, method, marks };
};

const isSplitUiEventTarget = (t) => !!(t && t.closest && t.closest('#view-controls, #log-panel, #tool-panel, #sidebar, button, input, select, label'));

const onSplitPointerDown = (e) => {
    if (!isBoxSelectMode) return;
    if (e.button !== undefined && e.button !== 0) return;
    if (isSplitUiEventTarget(e.target)) return;
    e.preventDefault();
    e.stopPropagation();
    try { mainViewEl.setPointerCapture(e.pointerId); } catch (_) {}
    const p = canvasPointFromEvent(e);
    splitDrag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
    updateMarqueeDom();
};
const onSplitPointerMove = (e) => {
    if (!isBoxSelectMode || !splitDrag) return;
    const p = canvasPointFromEvent(e);
    splitDrag.x1 = p.x; splitDrag.y1 = p.y;
    updateMarqueeDom();
};
const onSplitPointerUp = (e) => {
    if (!splitDrag) return;
    try { mainViewEl.releasePointerCapture(e.pointerId); } catch (_) {}
    const dragSnapshot = { x0: splitDrag.x0, y0: splitDrag.y0, x1: splitDrag.x1, y1: splitDrag.y1 };
    splitDrag = null;

    if (!splitSelectedParts.length) { logDebug('⚠️ 尚未框选任何 mesh'); return; }
    logDebug(`🚀 开始拆出 ${splitSelectedParts.length} 个可拆件...`);
    processingScene.scene.updateMatrixWorld(true);
    const partsToExport = splitSelectedParts.slice();
    clearSplitHighlights();

    const exportScene = new THREE.Scene();
    partsToExport.forEach(part => {
        const mesh = part.mesh;
        mesh.updateMatrixWorld(true);
        let clone;
        if (part.triIndices) {
            const geo = extractIslandGeometry(mesh.geometry, part.triIndices);
            const mat = Array.isArray(mesh.material) ? mesh.material[0].clone() : mesh.material.clone();
            clone = new THREE.Mesh(geo, mat);
        } else {
            clone = mesh.clone(true);
        }
        clone.matrix.copy(mesh.matrixWorld);
        clone.matrix.decompose(clone.position, clone.quaternion, clone.scale);
        clone.matrixAutoUpdate = true;
        exportScene.add(clone);
    });

    const exporter = new GLTFExporter();
    const options = { binary: true };
    const result = await new Promise((resolve, reject) => {
        const onDone = (r) => resolve(r);
        const onError = (err) => reject(err);
        if (exporter.parse.length === 4) exporter.parse(exportScene, onDone, onError, options);
        else exporter.parse(exportScene, onDone, options);
    });

    let newName = activeModel.name.replace(/\.glb$/i, '') + '_split.glb';
    if (modelFiles.some(f => f.parent === activeModel.parent && f.name === newName)) {
        const d = new Date();
        const ts = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + String(d.getSeconds()).padStart(2,'0');
        newName = newName.replace(/\.glb$/i, `_${ts}.glb`);
        logDebug(`⚠️ 同名 split 已存在，自动追加后缀 -> ${newName}`);
    }
    const fixedSplit = reinjectPhysicalMaterialExtensions(result, exportScene);
    const fileHandle = await activeModel.parent.getFileHandle(newName, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(fixedSplit);
    await writable.close();
    logDebug(`✅ 拆出保存成功: ${newName}`);
    await scanDirectory();
});

// 天坑：本页 Three r128 的 GLTFExporter 不写出 KHR_materials_transmission / clearcoat。
// 手术台→预览/导出 会把玻璃壳变成「白底实心」。从场景 MeshPhysicalMaterial 按材质名通用回写（不特判模型）。
const reinjectPhysicalMaterialExtensions = (glbBuffer, rootObject) => {
try {
    if (!glbBuffer || !rootObject) return glbBuffer;
    const matsByName = Object.create(null);
    rootObject.traverse(node => {
        if (!node.isMesh || !node.material) return;
        const list = Array.isArray(node.material) ? node.material : [node.material];
        list.forEach(m => {
            if (!m || !m.name) return;
            const prev = matsByName[m.name];
            if (!prev || (Number(m.transmission) || 0) > (Number(prev.transmission) || 0)) matsByName[m.name] = m;
        });
    });
    const u8 = glbBuffer instanceof ArrayBuffer ? new Uint8Array(glbBuffer) : new Uint8Array(glbBuffer);
    if (u8.byteLength < 28) return glbBuffer;
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    if (dv.getUint32(0, true) !== 0x46546C67) return glbBuffer;
    const jsonLen = dv.getUint32(12, true);
    const jsonStart = 20;
    if (jsonStart + jsonLen > u8.byteLength) return glbBuffer;
    const json = JSON.parse(new TextDecoder().decode(u8.subarray(jsonStart, jsonStart + jsonLen)));
    if (!json.materials || !json.materials.length) return glbBuffer;
    if (!json.extensionsUsed) json.extensionsUsed = [];
    const ensureUsed = (name) => { if (!json.extensionsUsed.includes(name)) json.extensionsUsed.push(name); };
    let patched = 0;
    json.materials.forEach(jm => {
        const m = matsByName[jm.name];
        if (!m) return;
        const transmission = Number(m.transmission) || 0;
        const clearcoat = Number(m.clearcoat) || 0;
        const clearcoatRoughness = Number(m.clearcoatRoughness) || 0;
        if (transmission <= 0.001 && clearcoat <= 0.001) return;
        if (!jm.extensions) jm.extensions = {};
        if (transmission > 0.001) {
            jm.extensions.KHR_materials_transmission = { transmissionFactor: transmission };
            ensureUsed('KHR_materials_transmission');
        }
        if (clearcoat > 0.001) {
            jm.extensions.KHR_materials_clearcoat = { clearcoatFactor: clearcoat, clearcoatRoughnessFactor: clearcoatRoughness };
            ensureUsed('KHR_materials_clearcoat');
        }
        if (typeof m.ior === 'number' && m.ior > 1.01 && Math.abs(m.ior - 1.5) > 0.001) {
            jm.extensions.KHR_materials_ior = { ior: m.ior };
            ensureUsed('KHR_materials_ior');
        }
        patched++;
    });
    if (!patched) return glbBuffer;
    const rest = u8.subarray(jsonStart + jsonLen);
    let jsonStr = JSON.stringify(json);
    const pad = (4 - (jsonStr.length % 4)) % 4;
    if (pad) jsonStr += ' '.repeat(pad);
    const jsonBytes = new TextEncoder().encode(jsonStr);
    const totalLen = 12 + 8 + jsonBytes.length + rest.length;
    const out = new ArrayBuffer(totalLen);
    const outDv = new DataView(out);
    const outU8 = new Uint8Array(out);
    outDv.setUint32(0, 0x46546C67, true);
    outDv.setUint32(4, 2, true);
    outDv.setUint32(8, totalLen, true);
    outDv.setUint32(12, jsonBytes.length, true);
    outDv.setUint32(16, 0x4E4F534A, true);
    outU8.set(jsonBytes, 20);
    outU8.set(rest, 20 + jsonBytes.length);
    logDebug(`✅ 已回写玻璃扩展 ${patched} 个材质 (transmission/clearcoat)`);
    return out;
} catch (e) {
    logDebug('⚠️ 玻璃扩展回写失败，沿用原二进制流', e);
    return glbBuffer;
}
};

// --- Matcap 直出预览（Sketchfab 类材质：model-viewer 不支持 MeshMatcap，手术台内用 Three 直出）---
// matcapCanvas / matcapPreview 已在顶部声明；此处不再重复 let
const findSfMatcapTexture = (root) => {
    let found = null;
    root.traverse(node => {
        if (!node.isMesh || !node.material) return;
        const mats = Array.isArray(node.material) ? node.material : [node.material];
        mats.forEach(m => {
            const extras = m.extras || m.userData || {};
            if (extras.sfEyeball) return; // 眼球 Matcap 不参与皮肤查找
            if (extras.sfMatcap && m.emissiveMap) found = m.emissiveMap;
            [m.map, m.emissiveMap, m.aoMap].forEach(t => {
                if (!t) return;
                const n = String(t.name || '').toLowerCase();
                if (/skin_|matcap/.test(n) && !/gray|metal|wet|glass/.test(n)) found = t;
            });
        });
    });
    return found;
};
const findSfEyeballMatcapTexture = (root) => {
    let found = null;
    root.traverse(node => {
        if (!node.isMesh || !node.material) return;
        const mats = Array.isArray(node.material) ? node.material : [node.material];
        mats.forEach(m => {
            const extras = m.extras || m.userData || {};
            if (!extras.sfEyeball) return;
            if (extras.sfEyeballMatcap && m.emissiveMap) {
                const n = String(m.emissiveMap.name || '').toLowerCase();
                if (!/skin_|gray/.test(n)) found = m.emissiveMap;
            }
            [m.emissiveMap, m.map].forEach(t => {
                if (!t) return;
                const n = String(t.name || '').toLowerCase();
                if (/skin_|gray/.test(n)) return;
                if (/^(metal|wet|glass)/.test(n) || /(^|[_-])(metal|wet|glass)(\.|$)/.test(n)) found = t;
            });
        });
    });
    return found;
};
const tagSfSparsePatchMeshes = (root) => {
    // 通用：补洞片默认隐藏（主网格 FrontSide 已补洞；可见时易 z-fight 成胸口黑斑）
    if (!root) return 0;
    let n = 0;
    root.traverse(node => {
        if (!node.isMesh || !node.material) return;
        const mats = Array.isArray(node.material) ? node.material : [node.material];
        if (mats.some(m => (m.extras || m.userData || {}).sfSparsePatch)) {
            node.visible = false;
            n++;
        }
    });
    return n;
};
const upgradeSfMatcapMaterials = (gltf) => {
    if (!gltf || !gltf.scene) return false;
    const matcapTex = findSfMatcapTexture(gltf.scene);
    const eyeMatcapTex = findSfEyeballMatcapTexture(gltf.scene);
    // 仅当存在皮肤 Matcap 贴图才进直出预览。PBR_Preview 已去掉 sfMatcap，只剩 sfEyeball 时
    // 若仍进 Matcap 画布，摄影棚/曝光无效，且皮肤会落成错误着色。
    if (!matcapTex) return false;
    const nPatch = tagSfSparsePatchMeshes(gltf.scene);
    if (nPatch) logDebug(`👁 补洞叠层×${nPatch}：默认隐藏（防胸口 z-fight 黑斑）`);
    if (matcapTex) {
        if ('colorSpace' in matcapTex) matcapTex.colorSpace = THREE.SRGBColorSpace;
        else if ('encoding' in matcapTex) matcapTex.encoding = THREE.sRGBEncoding;
        matcapTex.needsUpdate = true;
    }
    if (eyeMatcapTex) {
        if ('colorSpace' in eyeMatcapTex) eyeMatcapTex.colorSpace = THREE.SRGBColorSpace;
        else if ('encoding' in eyeMatcapTex) eyeMatcapTex.encoding = THREE.sRGBEncoding;
        eyeMatcapTex.needsUpdate = true;
    }
    let nMatcap = 0, nEye = 0, nEyeMesh = 0;
    gltf.scene.traverse(node => {
        if (!node.isMesh || !node.material) return;
        const mats = Array.isArray(node.material) ? node.material : [node.material];
        const next = mats.map(m => {
            const extras = m.extras || m.userData || {};
            if (extras.sfEyeball) {
                let eye;
                if (m.map) {
                    if ('colorSpace' in m.map) m.map.colorSpace = THREE.SRGBColorSpace;
                    else if ('encoding' in m.map) m.map.encoding = THREE.sRGBEncoding;
                    m.map.needsUpdate = true;
                    m.map.flipY = true;
                    if ('wrapS' in m.map) { m.map.wrapS = THREE.ClampToEdgeWrapping; m.map.wrapT = THREE.ClampToEdgeWrapping; }
                    m.map.needsUpdate = true;
                    // Basic 直出虹膜贴图，避免 Lambert+灯把巩膜打成白环
                    eye = new THREE.MeshBasicMaterial({
                        map: m.map,
                        color: new THREE.Color(1, 1, 1),
                        // 双眼合并网格常有一侧绕序反，单面会整眼黑_void
                        side: THREE.DoubleSide,
                        transparent: false,
                        depthWrite: true,
                        polygonOffset: true,
                        polygonOffsetFactor: -4,
                        polygonOffsetUnits: -4
                    });
                } else {
                    eye = new THREE.MeshPhongMaterial({
                        color: new THREE.Color(0.2, 0.18, 0.17),
                        specular: new THREE.Color(0.95, 0.95, 1),
                        shininess: 220,
                        side: THREE.FrontSide,
                        transparent: false,
                        depthWrite: true
                    });
                }
                eye.name = m.name;
                eye.userData.sfEyeball = true;
                nEye++;
                return eye;
            }
            const isMatcapMat = !!extras.sfMatcap || (matcapTex && m.emissiveMap && m.emissiveMap === matcapTex);
            if (extras.sfSparsePatch && m.map) {
                if ('colorSpace' in m.map) m.map.colorSpace = THREE.SRGBColorSpace;
                else if ('encoding' in m.map) m.map.encoding = THREE.sRGBEncoding;
                m.map.needsUpdate = true;
                const bm = new THREE.MeshBasicMaterial({
                    map: m.map,
                    color: new THREE.Color(1, 1, 1),
                    side: THREE.FrontSide,
                    polygonOffset: true,
                    polygonOffsetFactor: 2,
                    polygonOffsetUnits: 2
                });
                bm.name = m.name;
                bm.userData.sfSparsePatch = true;
                nMatcap++;
                return bm;
            }
            if (!isMatcapMat || !matcapTex) return m;
            if (m.map) {
                if ('colorSpace' in m.map) m.map.colorSpace = THREE.SRGBColorSpace;
                else if ('encoding' in m.map) m.map.encoding = THREE.sRGBEncoding;
                m.map.needsUpdate = true;
            }
            const mm = new THREE.MeshMatcapMaterial({
                matcap: matcapTex,
                map: m.map || null,
                // 略提亮乘色，让底色 mottling 更能透出来（减轻纯黏土感）
                color: new THREE.Color(1.03, 1.05, 1.06),
                side: (m.side === THREE.BackSide) ? THREE.BackSide
                    : ((m.side === THREE.DoubleSide || extras.doubleSided || m.doubleSided) ? THREE.DoubleSide : THREE.FrontSide),
                transparent: false,
                opacity: 1,
                depthWrite: true
            });
            if (extras.sfSparsePatch) {
                mm.userData.sfSparsePatch = true;
            }
            if (m.normalMap) {
                mm.normalMap = m.normalMap;
                mm.normalScale = m.normalScale ? m.normalScale.clone() : new THREE.Vector2(0.55, 0.55);
                // 过强法线在柔光下像树杈深纹；Matcap 预览再压一档
                if (mm.normalScale) mm.normalScale.multiplyScalar(0.45);
            }
            mm.name = m.name;
            mm.userData.sfMatcap = true;
            mm.userData.origNormalScale = mm.normalScale ? mm.normalScale.clone() : new THREE.Vector2(1, 1);
            nMatcap++;

        return;
    }
    if (st) st.innerText = '未检测到 18080，仅浏览器选目录（不能记住盘符）…';
    const browserHandle = await window.showDirectoryPicker({ id: 'glb_manager_repo', mode: 'readwrite' });
    await connectDirectory(browserHandle);
    logDebug(`✅ 浏览器已连接文件夹: ${browserHandle.name}（无盘符路径）`);
    if (st) st.innerText = `已连接「${browserHandle.name}」· 无 18080，无法「打开所在文件夹」`;
    alert('已能预览模型，但当前没有 18080 服务，浏览器不会告诉网页盘符路径。\n若要用「打开所在文件夹」，请用 Portal「01_Glb管理器.bat」重新打开后再点「新文件夹」。');
} catch (err) {
    if (err && err.name === 'AbortError') {
        logDebug("ℹ️ 操作已取消");
        if (st) st.innerText = '已取消选择文件夹';
    } else {
        logDebug("❌ 选择文件夹失败", err);
        alert("选择文件夹失败: " + (err && err.message ? err.message : String(err)));
    }
} finally {
    if (btn) { btn.disabled = false; btn.innerText = prevLabel || '新文件夹'; }
}
};

if(await currentDirHandle.requestPermission({mode:'readwrite'}) === 'granted') {
document.getElementById('btn-restore-dir').style.display='none'; await scanDirectory(); } } catch(e) { logDebug("❌ 恢复权限失败", e); } };
const searchInp = document.getElementById('search-input');
searchInp.addEventListener('focus', () => { renderSearchSuggestPanel(searchInp.value, { open: true }); });
searchInp.addEventListener('click', () => { renderSearchSuggestPanel(searchInp.value, { open: true }); });
searchInp.addEventListener('input', (e) => {
    applySearchFilter(e.target.value);
    renderSearchSuggestPanel(e.target.value, { open: true });
});
searchInp.addEventListener('keydown', (e) => {
    const panel = getSearchSuggestPanel();
    if (!panel || !panel.classList.contains('open')) {
        if (e.key === 'ArrowDown') renderSearchSuggestPanel(searchInp.value, { open: true });
        return;
    }
    const items = [...panel.querySelectorAll('.search-suggest-item')];
    if (!items.length) return;
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        searchSuggestActiveIdx = Math.min(items.length - 1, searchSuggestActiveIdx + 1);
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        searchSuggestActiveIdx = Math.max(0, searchSuggestActiveIdx - 1);
    } else if (e.key === 'Enter' && searchSuggestActiveIdx >= 0) {
        e.preventDefault();
        pickSearchSuggest(items[searchSuggestActiveIdx].textContent);
        return;
    } else if (e.key === 'Escape') {
        hideSearchSuggestPanel();
        return;
    } else {
        return;
    }
    items.forEach((el, i) => el.classList.toggle('active', i === searchSuggestActiveIdx));
    if (searchSuggestActiveIdx >= 0) items[searchSuggestActiveIdx].scrollIntoView({ block: 'nearest' });
});
searchInp.addEventListener('blur', () => { setTimeout(hideSearchSuggestPanel, 120); });
searchInp.addEventListener('mousedown', function(e) { if(this.value && e.offsetX > this.offsetWidth - 40) { this.value = ''; this.dispatchEvent(new Event('input')); } });
document.addEventListener('mousedown', (e) => {
    const wrap = document.getElementById('search-wrap');
    if (wrap && !wrap.contains(e.target)) hideSearchSuggestPanel();
});

const resizer = document.getElementById('sidebar-resizer');
const sidebar = document.getElementById('sidebar');
let isResizing = false;
resizer.addEventListener('mousedown', () => { isResizing = true; resizer.classList.add('is-resizing'); document.body.style.userSelect = 'none'; document.body.style.cursor = 'col-resize'; });
document.addEventListener('mousemove', (e) => { if(!isResizing) return; let w = e.clientX; if(w < 280) w = 280; if(w > window.innerWidth * 0.7) w = window.innerWidth * 0.7; sidebar.style.width = w + 'px'; });
document.addEventListener('mouseup', () => { if(isResizing){ isResizing = false; resizer.classList.remove('is-resizing'); document.body.style.userSelect = ''; document.body.style.cursor = ''; }});
