<body>
  <header class="app-header">
    <div class="app-header-inner">
      <h1 class="app-title">头部肌肉色彩变更</h1>
      <div class="header-bar">
        <select id="projectSelect" class="project-select" title="切换工程">
          <option value="">加载中…</option>
        </select>
        <button type="button" id="btnImportGlb">导入 GLB</button>
        <input type="file" id="fileGlb" accept=".glb,.gltf" hidden />
        <button type="button" id="btnNewFromEuro">欧版新建</button>
        <button type="button" id="btnDeleteProject" disabled title="删除当前工程">删除</button>
        <span id="modelName" class="header-meta">未选择工程</span>
      </div>
    </div>
  </header>

        <div class="part-tree-toolbar" id="leftTreeToolbar"></div>
      </div>

        <div class="viewer-host" id="viewerHost">

        </div>
      </div>
    </section>
    <aside class="control-panel morph-panel" id="morphPanel"><p class="lm-stat">加载模型后显示控制面板…</p></aside>
  </main>
  <div id="exportOverlay" class="export-overlay" hidden>

      <div class="export-overlay-step" id="exportStepText">准备中…</div>
      <div class="export-progress-track">
        <div class="export-progress-bar" id="exportProgressBar"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "./vendor/controls/OrbitControls.js";
    import { GLTFLoader } from "./vendor/loaders/GLTFLoader.js";
    import { DRACOLoader } from "./vendor/loaders/DRACOLoader.js";
    import { createBoneMorphController } from "./bone_morph.js?build=sculpt-brush-20260908ag";
    import { GLTFExporter } from "./vendor/exporters/GLTFExporter.js";

    const boneMorph = createBoneMorphController(THREE);
    const elHost = document.getElementById("viewerHost");
    const elStatus = document.getElementById("viewerStatus");
    const elModelName = document.getElementById("modelName");
    const elFile = document.getElementById("fileGlb");
    const elProjectSelect = document.getElementById("projectSelect");
    const elBtnDeleteProject = document.getElementById("btnDeleteProject");
    const elTreeSidebar = document.getElementById("treeSidebar");
    const elWorkspace = document.getElementById("workspace");

    let viewerSlot = null;
    let currentProjectId = "";
    let currentModelLabel = "";
    let projects = [];
    let activeProjectId = "";
    let morphPanelTab = "color";
    let selectedHistoryId = "";
    let leftTreeMode = "islands";
    let morphPanelPickToken = "";
    let morphPartHighlightId = "";
    let morphIslandFocusToken = "";
    let pendingIslandTreeScroll = "";
    let morphIslandTreeFilter = "";
    let morphPartTreeFilter = "";
    let exportInProgress = false;
    const partTreeCollapsed = new Set();
    let partOffsetUiSyncing = false;
    let morphPanelDelegated = false;
    /** workspace 面板委托的 AbortController；与 morphPanelDelegated 一起保证只绑一次 */
    let morphPanelAborter = null;
    let partTreeCollapsedInit = false;
    let projectBusy = false;
    /** 同一工程会话内，Farkas 默认锚点清空提示只问一次 */
    let defaultLandmarksPromptKey = "";
    let defaultLandmarksPromptDone = false;

    async function fetchProjects() {
      const r = await fetch(`/api/projects?_=${Date.now()}`);
      if (!r.ok) throw new Error("无法读取工程列表");
      const data = await r.json();
      projects = data.items || [];
      activeProjectId = data.activeId || "";
      renderProjectList();
      return data;
    }

    function renderProjectSelect() {
      if (!elProjectSelect) return;
      if (!projects.length) {
        elProjectSelect.innerHTML = `<option value="">暂无工程</option>`;
        elProjectSelect.disabled = true;
        if (elBtnDeleteProject) elBtnDeleteProject.disabled = true;
        return;
      }
      elProjectSelect.disabled = false;
      elProjectSelect.innerHTML = projects
        .map((p) => {
          const when = (p.updatedAt || p.createdAt || "").replace("T", " ").slice(0, 16);
          const meta = p.originalName || p.glbFile || "";
          const label = `${p.label || p.id}${meta ? ` · ${meta}` : ""}${when ? ` · ${when}` : ""}`;
          const sel = p.id === currentProjectId ? " selected" : "";
          return `<option value="${p.id}"${sel}>${label}</option>`;
        })
        .join("");
      if (elBtnDeleteProject) elBtnDeleteProject.disabled = !currentProjectId;
    }

    function renderProjectList() {
      renderProjectSelect();
    }

    function syncTreeModeUi() {
      if (elTreeSidebar) {
        elTreeSidebar.hidden = !boneMorph.getRoot();
      }
    }

    async function setActiveProjectOnServer(id) {
      await fetch("/api/projects/active", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: id || "" }),
      });
      activeProjectId = id || "";
    }

    async function openProject(project, { skipSave = false, force = false } = {}) {
      if (!project?.id || !project?.glbUrl) return;
      if (project.id === currentProjectId && !force) return;
      if (projectBusy && !force) return;
      const ownedBusy = !projectBusy;
      if (ownedBusy) projectBusy = true;
      const prevId = currentProjectId;
      try {
        if (boneMorph?.setShowSelectionOverlay) boneMorph.setShowSelectionOverlay(false);
        currentProjectId = project.id;
        currentModelLabel = project.label || project.id;
        if (defaultLandmarksPromptKey !== project.id) {
          defaultLandmarksPromptKey = project.id;
          defaultLandmarksPromptDone = false;
        }
        renderProjectList();
        elModelName.textContent = currentModelLabel;
        elStatus.textContent = "加载中… " + currentModelLabel;
        disposeViewer();
        const activeReq = setActiveProjectOnServer(project.id);
        const loadReq = loadGltfFromUrl(`${project.glbUrl}?_=${Date.now()}`, currentModelLabel, project.id);
        await Promise.all([activeReq, loadReq]);
      } catch (err) {
        console.error(err);
        elStatus.textContent = "切换工程失败";
        alert("切换工程失败：" + (err?.message || err));
      } finally {
        if (ownedBusy) projectBusy = false;
      }
    }

    async function importProjectFile(file) {
      const fd = new FormData();
      fd.append("file", file, file.name);
      elStatus.textContent = "上传中… " + file.name;
      const r = await fetch("/api/projects/import", { method: "POST", body: fd });
      const data = await r.json();
      if (!r.ok || !data.ok) throw new Error(data.error || "导入失败");
      disposeViewer();
      await fetchProjects();
      await openProject(data.project, { skipSave: true });
    }

    async function createProjectFromDefault() {
      elStatus.textContent = "从欧版创建工程…";
      const r = await fetch("/api/projects/from-default", { method: "POST" });
      const data = await r.json();
      if (!r.ok || !data.ok) throw new Error(data.error || "创建失败");
      disposeViewer();
      await fetchProjects();
      await openProject(data.project, { skipSave: true });
    }

    async function deleteProject(id) {
      if (projectBusy) return;
      const p = projects.find((x) => x.id === id);
      const name = p?.label || id;
      if (!confirm(`删除工程「${name}」？\n将删除该目录下模型与全部存档，不可恢复。`)) return;
      projectBusy = true;
      try {
        if (currentProjectId === id) {
          disposeViewer();
          currentProjectId = "";
        }
        const r = await fetch(`/api/projects/${encodeURIComponent(id)}`, { method: "DELETE" });
        const data = await r.json();
        if (!r.ok || !data.ok) throw new Error(data.error || "删除失败");
        await fetchProjects();
        if (currentProjectId) return;
        const next = projects.find((x) => x.id === data.activeId) || projects[0];
        if (next) {
          try {
            await openProject(next, { skipSave: true, force: true });
          } catch (e) {
            console.warn("open next project after delete failed", e);
            elModelName.textContent = "未选择工程";
            elStatus.textContent = "工程已删除，请手动选择其它工程";
          }
        } else {
          elModelName.textContent = "未选择工程";
          elStatus.textContent = "请选择或新建工程";
          document.getElementById("morphPanel").innerHTML =
            `<p class="lm-stat">请先导入 GLB 或从欧版新建工程。</p>`;
        }
      } finally {
        projectBusy = false;
      }
    }

    function makeGltfLoader() {
      const loader = new GLTFLoader();
      const draco = new DRACOLoader();
      draco.setDecoderPath("./vendor/draco/gltf/");
      loader.setDRACOLoader(draco);
      return loader;
    }

    function disposeViewer() {
      boneMorph.setIslandPreviewDock(null);
      boneMorph.dispose();
      if (viewerSlot) {
        cancelAnimationFrame(viewerSlot.raf);
        if (viewerSlot.controls) viewerSlot.controls.dispose();
        if (viewerSlot.renderer) viewerSlot.renderer.dispose();
        if (viewerSlot.ro) viewerSlot.ro.disconnect();
        if (viewerSlot.root && viewerSlot.scene) viewerSlot.scene.remove(viewerSlot.root);
        viewerSlot = null;
      }
      // 勿重置 morphPanelDelegated：click/change 等委托挂在持久 #workspace 上，
      // 切工程若只清标志不 removeEventListener，会重复绑定（存档保存/删除确认框弹两次等）。
      selectedHistoryId = "";
    }

    function fitCamera(camera, controls, object, host) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z, 1e-6);
      const aspect = Math.max((host.clientWidth || 800) / Math.max(host.clientHeight || 560, 1), 1e-6);
      const padding = 1.12;
      const frustumHeight = maxDim * padding;
      camera.left = (-frustumHeight * aspect) / 2;
      camera.right = (frustumHeight * aspect) / 2;
      camera.top = frustumHeight / 2;
      camera.bottom = -frustumHeight / 2;
      camera.near = -maxDim * 30;
      camera.far = maxDim * 30;
      camera.zoom = 1;
      camera.position.set(center.x, center.y, center.z + maxDim * 3);
      camera.lookAt(center);
      camera.updateProjectionMatrix();
      controls.target.copy(center);
      controls.update();
      return { frustumHeight, baseRadius: maxDim * 3 };
    }

    function prepareMeshMaterials(root) {
      root.traverse((obj) => {
        if (!obj.isMesh || !obj.material) return;
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        for (const mat of mats) {
          if (!mat) continue;
          if ("metalness" in mat) mat.metalness = 0;
          if ("roughness" in mat) mat.roughness = Math.max(Number(mat.roughness) || 0.5, 0.48);
          mat.needsUpdate = true;
        }
      });
    }

    function ensureViewer() {
      if (viewerSlot) return viewerSlot;
      const w = elHost.clientWidth || 800;
      const h = elHost.clientHeight || 560;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);
      const aspect = w / Math.max(h, 1);
      const camera = new THREE.OrthographicCamera(-aspect, aspect, 1, -1, -1000, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.LinearToneMapping;
      renderer.toneMappingExposure = 1.35;

      const statusEl = elStatus;
      elHost.innerHTML = "";
      elHost.appendChild(renderer.domElement);
      const islandPreviewDock = document.createElement("div");
      islandPreviewDock.id = "islandPreviewDock";
      islandPreviewDock.className = "island-preview-dock";
      islandPreviewDock.hidden = true;
      elHost.appendChild(islandPreviewDock);
      boneMorph.setIslandPreviewDock(islandPreviewDock);
      if (statusEl) elHost.appendChild(statusEl);

      const hemi = new THREE.HemisphereLight(0xffffff, 0xd0d0d0, 1.35);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xffffff, 1.25);
      dir.position.set(2.2, 3.5, 2.8);
      scene.add(dir);
      const fill = new THREE.DirectionalLight(0xffffff, 0.7);
      fill.position.set(-2.5, 1.2, -1.5);
      scene.add(fill);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;

      viewerSlot = {
        scene,
        camera,
        renderer,
        controls,
        raf: 0,
        ro: null,
        frustumHeight: 1,
        baseRadius: 1,
        root: null,
      };

      const tick = () => {
        viewerSlot.raf = requestAnimationFrame(tick);
        controls.update();
        boneMorph.renderCheckedIslandPreviews();
        renderer.render(scene, camera);
      };
      const ro = new ResizeObserver(() => {
        const nw = elHost.clientWidth;
        const nh = elHost.clientHeight;
        if (nw < 2 || nh < 2) return;
        const a = nw / nh;
        const fh = viewerSlot.frustumHeight || 1;
        camera.left = (-fh * a) / 2;
        camera.right = (fh * a) / 2;
        camera.top = fh / 2;
        camera.bottom = -fh / 2;
        camera.updateProjectionMatrix();
        renderer.setSize(nw, nh, false);
      });
      ro.observe(elHost);
      viewerSlot.ro = ro;
      tick();
      return viewerSlot;
    }

    async function attachGltfRoot(root, label, projectId) {
      const slot = ensureViewer();
      if (slot.root) {
        slot.scene.remove(slot.root);
        slot.root = null;
      }
      prepareMeshMaterials(root);
      slot.scene.add(root);
      slot.root = root;
      const fit = fitCamera(slot.camera, slot.controls, root, elHost);
      slot.frustumHeight = fit.frustumHeight;
      slot.baseRadius = fit.baseRadius;
      currentModelLabel = label;
      elModelName.textContent = `当前工程：${label}`;
      elStatus.textContent = "就绪 · 勾选调色 · Alt+点或点行闪黄确认 · " + label;
      await boneMorph.attach({
        root,
        scene: slot.scene,
        camera: slot.camera,
        domElement: slot.renderer.domElement,
        controls: slot.controls,
        projectId: projectId || currentProjectId,
        islandPreviewDockEl: document.getElementById("islandPreviewDock"),
        onChange: () => requestAnimationFrame(() => patchMorphPanel()),
      });
      window.__boneMorph = boneMorph;
      window.__setMorphSideView = () => {
        const slot = viewerSlot;
        if (!slot?.controls || !slot?.camera || !slot?.root) return false;
        const center = new THREE.Vector3();
        const box3 = new THREE.Box3().setFromObject(slot.root);
        box3.getCenter(center);
        const radius = slot.baseRadius || box3.getSize(new THREE.Vector3()).length() * 0.55 || 3;
        slot.controls.target.copy(center);
        slot.camera.position.set(center.x + radius * 2.05, center.y + radius * 0.06, center.z);
        slot.camera.lookAt(center);
        slot.controls.update();
        return true;
      };
      window.__forceMorphRender = (frames = 3) => {
        const slot = viewerSlot;
        if (!slot?.renderer || !slot?.scene || !slot?.camera) return false;
        for (let i = 0; i < frames; i++) {
          slot.controls?.update?.();
          boneMorph.renderCheckedIslandPreviews();
          slot.renderer.render(slot.scene, slot.camera);
        }
        return true;
      };
      morphPanelTab = "color";
      fillMorphPanel();
      maybePromptClearDefaultLandmarks();
    }

    function maybePromptClearDefaultLandmarks() {
      const key = currentProjectId || currentModelLabel || "";
      if (!key || !boneMorph.getRoot?.()) return;
      if (defaultLandmarksPromptKey === key && defaultLandmarksPromptDone) return;
      defaultLandmarksPromptKey = key;
      defaultLandmarksPromptDone = true;
      if (!boneMorph.hasDefaultLandmarks?.()) return;
      const ok = confirm(
        "检测到头部默认锚点，是否一键清空？仅删 Farkas 默认点，自加点保留。"
      );
      if (!ok) return;
      boneMorph.clearDefaultLandmarks();
      fillMorphPanel();
    }

    function loadGltfFromUrl(url, label, projectId) {
      elStatus.textContent = "加载中… " + label;
      const loader = makeGltfLoader();
      return new Promise((resolve, reject) => {
        loader.load(
          url,
          async (gltf) => {
            try {
              await attachGltfRoot(gltf.scene || gltf.scenes[0], label, projectId);
              resolve();
            } catch (e) {
              console.error(e);
              elStatus.textContent = "初始化失败：" + e.message;
              reject(e);
            }
          },
          undefined,
          (err) => {
            console.error(err);
            elStatus.textContent = "加载失败：" + label;
            reject(err);
          }
        );
      });
    }

    function morphPointLabel(st, id) {
      const lm = (st.farkas.landmarks || []).find((l) => l.id === id);
      const custom = st.customMeta[id];
      return lm?.label || custom?.label || id;
    }

    function morphPointListHtml(st) {
      const sel = st.selectedId;
      return (
        st.pointIds
          .map((id) => {
            const label = morphPointLabel(st, id);
            const on = id === sel ? ' class="on"' : "";
            return `<li data-point="${id}"${on}><strong>${label}</strong><div class="meta">${id}</div></li>`;
          })
          .join("") ||
        `<li class="meta" style="cursor:default;padding:8px">暂无锚点，进入加点模式后在模型上点击</li>`
      );
    }

    function morphPickBannerHtml(st) {
      if (st.hslScope === "parts") {
        const checked = st.islandChecked || [];
        if (!st.islandScanDone) {
          return `<div class="morph-pick-banner" id="morphPickBanner" style="color:var(--muted)">扫描中…</div>`;
        }
        if (checked.length) {
          return `<div class="morph-pick-banner" id="morphPickBanner">已勾选 <strong>${checked.length}</strong> 块 · 右上角预览</div>`;
        }
        return `<div class="morph-pick-banner" id="morphPickBanner" style="color:var(--muted)">左侧树：勾选设色/位移 · Alt+点或点行定位</div>`;
      }
      if (st.hslScope === "all" || st.hslScope === "muscles") {
        const label = st.hslScope === "all" ? "全部" : "肌肉层";
        return `<div class="morph-pick-banner" id="morphPickBanner">作用域：<strong>${label}</strong></div>`;
      }
      return "";
    }

    function updateMorphPickBanner(host, st) {
      const html = morphPickBannerHtml(st);
      const el = host.querySelector("#morphPickBanner");
      if (!html) {
        el?.remove();
        return;
      }
      if (el) el.outerHTML = html;
      else host.querySelector('[data-morph-pane="color"]')?.insertAdjacentHTML("afterbegin", html);
    }

    function applyMorphHslFromUi(host, notify) {
      const h = parseFloat(host.querySelector("#morphHslH")?.value || "0");
      const s = parseFloat(host.querySelector("#morphHslS")?.value || "0");
      const l = parseFloat(host.querySelector("#morphHslL")?.value || "0");
      const hv = host.querySelector("#morphHslHVal");
      const sv = host.querySelector("#morphHslSVal");
      const lv = host.querySelector("#morphHslLVal");
      if (hv) hv.textContent = `${Math.round(h)}°`;
      if (sv) sv.textContent = `${Math.round(s)}`;
      if (lv) lv.textContent = `${Math.round(l)}`;
      boneMorph.setScopeHsl(h / 360, s / 100, l / 100, {
        notify,
        immediate: !!notify,
      });
    }

    const XYZ_MIN = -0.02;
    const XYZ_MAX = 0.02;
    const XYZ_STEP = 0.0005;
    const PART_OFFSET_MIN = -0.02;
    const PART_OFFSET_MAX = 0.02;
    const PART_OFFSET_STEP = 0.0005;

    function syncAnchorXyzUi(host, xyz) {
      if (!host || !xyz) return;
      [0, 1, 2].forEach((i) => {
        const v = Number((xyz[i] || 0).toFixed(4));
        const valEl = host.querySelector(`[data-xyz-val="${i}"]`);
        const rangeEl = host.querySelector(`[data-xyz-range="${i}"]`);
        const numEl = host.querySelector(`[data-xyz="${i}"]`);
        if (valEl && document.activeElement !== rangeEl && document.activeElement !== numEl) {
          valEl.textContent = v.toFixed(4);
        }
        if (rangeEl && document.activeElement !== rangeEl) rangeEl.value = String(v);
        if (numEl && document.activeElement !== numEl) numEl.value = String(v);
      });
    }

    function applyAnchorXyzAxis(host, axis, value) {
      const st = boneMorph.getState();
      const pid = st.selectedId;
      if (!pid) return;
      const cur = (st.xyzOffset[pid] || [0, 0, 0]).slice();
      cur[axis] = value;
      boneMorph.setXyz(pid, cur[0], cur[1], cur[2]);
      syncAnchorXyzUi(host, cur);
    }

    function anchorXyzRowHtml(axis, label, value) {
      const v = Number((value || 0).toFixed(4));
      return `<div class="morph-row morph-xyz-row">
        <label>${label}</label>
        <span class="val" data-xyz-val="${axis}">${v.toFixed(4)}</span>
        <input type="range" data-xyz-range="${axis}" min="${XYZ_MIN}" max="${XYZ_MAX}" step="${XYZ_STEP}" value="${v}" style="grid-column:1/-1" />
        <input type="number" data-xyz="${axis}" step="${XYZ_STEP}" min="${XYZ_MIN}" max="${XYZ_MAX}" value="${v}" style="grid-column:1/-1" />
      </div>`;
    }

    function partOffsetRowHtml(axis, label, value, disabled = false) {
      const v = Number((value || 0).toFixed(4));
      const dis = disabled ? " disabled" : "";
      return `<div class="part-offset-row">
        <label>${label}</label>
        <input type="number" data-part-offset="${axis}" step="${PART_OFFSET_STEP}" min="${PART_OFFSET_MIN}" max="${PART_OFFSET_MAX}" value="${v}"${dis} />
        <input type="range" data-part-offset-range="${axis}" min="${PART_OFFSET_MIN}" max="${PART_OFFSET_MAX}" step="${PART_OFFSET_STEP}" value="${v}"${dis} />
      </div>`;
    }

    function readPartOffsetAxis(host, axis) {
      const numEl = host.querySelector(`[data-part-offset="${axis}"]`);
      const rangeEl = host.querySelector(`[data-part-offset-range="${axis}"]`);
      if (document.activeElement === numEl && numEl) return parseFloat(numEl.value) || 0;
      if (document.activeElement === rangeEl && rangeEl) return parseFloat(rangeEl.value) || 0;
      if (numEl) return parseFloat(numEl.value) || 0;
      return parseFloat(rangeEl?.value || "0") || 0;
    }

    function syncPartOffsetUi(host, offset, force) {
      if (!host || !offset) return;
      partOffsetUiSyncing = true;
      try {
        [0, 1, 2].forEach((i) => {
          const v = Number((offset[i] || 0).toFixed(4));
          const numEl = host.querySelector(`[data-part-offset="${i}"]`);
          const rangeEl = host.querySelector(`[data-part-offset-range="${i}"]`);
          if (numEl && (force || document.activeElement !== numEl)) numEl.value = String(v);
          if (rangeEl && (force || document.activeElement !== rangeEl)) rangeEl.value = String(v);
        });
      } finally {
        partOffsetUiSyncing = false;
      }
      const meta = host.querySelector(".part-offset-meta");
      if (meta) {
        const st = boneMorph.getState();
        const n = st.islandAdjustedCount || 0;
        const chk = (st.islandChecked || []).length;
        const tgt = st.islandOffsetTargetCount || 0;
        if (tgt > 1) {
          meta.textContent = `已勾选 ${chk} 块 · 联动位移 ${tgt} 块 · 已有 ${n} 块保留位移`;
        } else if (st.islandFocusToken) {
          meta.textContent = `定位编辑中 · 已有 ${n} 块保留位移 · 世界坐标 m`;
        } else {
          meta.textContent = `勾选孤岛后可位移 · 点空白取消定位 · 已有 ${n} 块保留位移`;
        }
      }
    }

    function applyPartOffsetFromUi(host) {
      if (partOffsetUiSyncing) return;
      const dx = readPartOffsetAxis(host, 0);
      const dy = readPartOffsetAxis(host, 1);
      const dz = readPartOffsetAxis(host, 2);
      const ok = boneMorph.setIslandOffset(dx, dy, dz);
      if (!ok) {
        const status = host.querySelector("#morphStatus");
        if (status) status.textContent = "请先勾选要打乱的孤岛";
        return;
      }
      syncPartOffsetUi(host, boneMorph.getState().islandOffset || [0, 0, 0], false);
    }

    function collectPartNodeIds(nodes, out = []) {
      for (const n of nodes || []) {
        out.push(n.id);
        if (n.children?.length) collectPartNodeIds(n.children, out);
      }
      return out;
    }

    function islandMeshCheckState(group, checked) {
      const tokens = (group.islands || []).map((x) => x.token);
      if (!tokens.length) return { on: false, indeterminate: false };
      let n = 0;
      for (const t of tokens) if (checked.includes(t)) n++;
      return {
        on: n === tokens.length,
        indeterminate: n > 0 && n < tokens.length,
      };
    }

    function islandTreeMatchesFilter(text, filter) {
      const q = String(filter || "").trim().toLowerCase();
      if (!q) return true;
      return String(text || "").toLowerCase().includes(q);
    }

    function colorIslandTreeHtml(st, filter = "") {
      const checked = st.islandChecked || [];
      const focus = st.islandFocusToken || "";
      const groups = st.colorIslandGroups || [];
      if (!st.islandScanDone) {
        return `<li class="meta" style="cursor:default;padding:8px">正在扫描几何孤岛…</li>`;
      }
      if (!groups.length) {
        return `<li class="meta" style="cursor:default;padding:8px">未找到几何孤岛（需带 UV 贴图的网格；3D 上连续的表面只会算一块）</li>`;
      }
      const total = groups.reduce((n, g) => n + (g.islands || []).length, 0);
      const rows = groups
        .map((g) => {
          const meshChk = islandMeshCheckState(g, checked);
          const collapsed = !!g.collapsed;
          const childRows = (g.islands || [])
            .map((isl) => {
              const isChk = checked.includes(isl.token);
              const isFocus = isl.token === focus;
              const match = islandTreeMatchesFilter(
                `${isl.shortLabel} ${isl.subLabel} ${isl.label} ${g.meshLabel}`,
                filter
              );
              const cls = ["part-tree-item", isFocus ? "on" : "", isChk ? "is-checked" : "", match ? "" : "is-filtered"]
                .filter(Boolean)
                .join(" ");
              return `<li class="${cls}" data-island-item="${isl.token}">
                <div class="part-tree-line" data-island-line="${isl.token}" style="padding-left:28px" title="${isl.label}">
                  <span class="island-swatch" style="background:${isl.previewHex || "#888"}"></span>
                  <input type="checkbox" data-island-check="${isl.token}"${isChk ? " checked" : ""} />
                  <span class="part-tree-label">
                    <strong>${isl.shortLabel || isl.label}</strong>
                    <span class="type">${isl.subLabel || ""}</span>
                  </span>
                </div>
              </li>`;
            })
            .join("");
          const groupMatch =
            islandTreeMatchesFilter(`${g.meshLabel} ${g.meshRawName}`, filter) ||
            (g.islands || []).some((isl) =>
              islandTreeMatchesFilter(`${isl.shortLabel} ${isl.subLabel} ${isl.label}`, filter)
            );
          const groupCls = [
            "part-tree-group",
            collapsed ? "is-collapsed" : "",
            groupMatch ? "" : "is-filtered",
          ]
            .filter(Boolean)
            .join(" ");
          return `<li class="${groupCls}" data-island-group="${g.meshKey}">
            <div class="part-tree-line" data-island-mesh-line="${g.meshKey}" style="padding-left:8px" title="${g.meshRawName || g.meshKey}">
              <button type="button" class="part-tree-fold" data-island-fold="${g.meshKey}" title="${collapsed ? "展开" : "折叠"}">▼</button>
              <input type="checkbox" data-island-mesh-check="${g.meshKey}"${meshChk.on ? " checked" : ""} />
              <span class="part-tree-label">
                <strong>${g.meshLabel}</strong>
                <span class="type">${(g.islands || []).length} 个孤岛</span>
              </span>
            </div>
            <ul class="part-tree-children">${childRows || `<li class="meta" style="padding-left:28px">无孤岛</li>`}</ul>
          </li>`;
        })
        .join("");
      const visible = filter
        ? groups.reduce((n, g) => {
            return (
              n +
              (g.islands || []).filter((isl) =>
                islandTreeMatchesFilter(
                  `${isl.shortLabel} ${isl.subLabel} ${isl.label} ${g.meshLabel}`,
                  filter
                )
              ).length
            );
          }, 0)
        : total;
      const head =
        filter && visible !== total
          ? `<li class="meta" style="cursor:default;padding:6px 8px">筛选「${filter}」：${visible} / ${total}</li>`
          : "";
      return head + rows;
    }

    function collectAllIslandTokens(st) {
      const out = [];
      for (const g of st.colorIslandGroups || []) {
        for (const isl of g.islands || []) out.push(isl.token);
      }
      return out;
    }

    function partTreeMatchesFilter(node, filter) {
      const q = String(filter || "").trim().toLowerCase();
      if (!q) return true;
      const self = `${node.name || ""} ${node.type || ""}`.toLowerCase().includes(q);
      if (self) return true;
      return (node.children || []).some((c) => partTreeMatchesFilter(c, filter));
    }

    function collectPartSubtreeIds(nodes, out = []) {
      for (const n of nodes || []) {
        out.push(n.id);
        if (n.children?.length) collectPartSubtreeIds(n.children, out);
      }
      return out;
    }

    function partSubtreeCheckState(node, checked) {
      const ids = collectPartSubtreeIds([node]);
      let n = 0;
      for (const id of ids) if (checked.includes(id)) n++;
      return { on: n > 0 && n === ids.length, indeterminate: n > 0 && n < ids.length, count: n, total: ids.length };
    }

    function partTreeHtml(nodes, checked, highlightId, filter = "", depth = 0) {
      if (!nodes?.length) {
        return `<li class="meta" style="cursor:default;padding:8px">无可用部件节点</li>`;
      }
      return nodes
        .map((n) => {
          if (!partTreeMatchesFilter(n, filter)) return "";
          const isOn = n.id === highlightId;
          const isChk = checked.includes(n.id);
          const hasKids = !!(n.children && n.children.length);
          const collapsed = partTreeCollapsed.has(n.id);
          const chkState = hasKids ? partSubtreeCheckState(n, checked) : { on: isChk, indeterminate: false };
          const itemCls = [
            hasKids ? "part-tree-group" : "part-tree-item",
            collapsed ? "is-collapsed" : "",
            isOn ? "on" : "",
            isChk || chkState.indeterminate ? "is-checked" : "",
          ]
            .filter(Boolean)
            .join(" ");
          const pad = 8 + depth * 12;
          const foldBtn = hasKids
            ? `<button type="button" class="part-tree-fold" data-part-fold="${n.id}" title="${collapsed ? "展开" : "折叠"}">▼</button>`
            : `<span class="part-tree-fold" style="visibility:hidden"></span>`;
          const kids = hasKids
            ? `<ul class="part-tree-children">${partTreeHtml(n.children, checked, highlightId, filter, depth + 1)}</ul>`
            : "";
          const attr = hasKids ? `data-part-group="${n.id}"` : `data-part-item="${n.id}"`;
          return `<li class="${itemCls}" ${attr}>
            <div class="part-tree-line" data-part-name="${n.id}" style="padding-left:${pad}px" title="${n.name}">
              ${foldBtn}
              <input type="checkbox" data-part-check="${n.id}"${chkState.on ? " checked" : ""} />
              <span class="part-tree-label"><strong>${n.name}</strong><span class="type">${n.type}${hasKids ? ` · ${n.children.length}` : ""}</span></span>
            </div>
            ${kids}
          </li>`;
        })
        .join("");
    }

    function leftTreeToolbarHtml(st) {
      const total = (st.colorIslandGroups || []).reduce((n, g) => n + (g.islands || []).length, 0);
      return `<span class="lm-stat" style="flex:1 1 100%;margin:0 0 2px">共 ${total} 块 · 点行/Alt+点定位 · 勾选调色/位移</span>
        <button type="button" id="islandTreeExpandAll">展开</button>
        <button type="button" id="islandTreeCollapseAll">收起</button>
        <button type="button" id="colorPartCheckAll">全选</button>
        <button type="button" id="colorPartCheckNone">清选</button>
        <input type="search" id="islandTreeFilter" class="island-tree-search" placeholder="搜索…" value="${morphIslandTreeFilter.replace(/"/g, "&quot;")}" />`;
    }

    function fillLeftTreePanel(st) {
      const list = document.getElementById("leftTreeList");
      const toolbar = document.getElementById("leftTreeToolbar");
      if (!list || !toolbar) return;
      if (!boneMorph.getRoot()) {
        list.innerHTML = `<li class="tree-empty">加载模型后显示孤岛树</li>`;
        toolbar.innerHTML = "";
        if (elTreeSidebar) elTreeSidebar.hidden = true;
        return;
      }
      if (elTreeSidebar) elTreeSidebar.hidden = false;
      toolbar.innerHTML = leftTreeToolbarHtml(st);
      syncTreeModeUi();
      if (!st.islandScanDone) {
        list.innerHTML = `<li class="tree-empty">正在扫描几何孤岛…</li>`;
        return;
      }
      list.innerHTML = colorIslandTreeHtml(st, morphIslandTreeFilter);
      syncIslandTreeUi(document.getElementById("treeSidebar"), st);
    }

    function scrollIslandTreeToToken(token) {
      if (!token) return;
      pendingIslandTreeScroll = token;
      boneMorph.revealIslandTreeToken(token);
      fillLeftTreePanel(boneMorph.getState());
    }

    function flushIslandTreeScroll(token) {
      if (!token || !elTreeSidebar) return;
      const row = elTreeSidebar.querySelector(`[data-island-item="${token}"]`);
      if (!row) return;
      row.classList.remove("is-flash");
      void row.offsetWidth;
      row.classList.add("is-flash");
      row.scrollIntoView({ block: "nearest", behavior: "smooth" });
      pendingIslandTreeScroll = "";
    }

    function syncPartTreeUi(host, st) {
      if (!host) return;
      const checked = st.partChecked || [];
      const highlight = st.partHighlightId || "";
      host.querySelectorAll("[data-part-check]").forEach((el) => {
        const id = el.getAttribute("data-part-check");
        const li = el.closest("[data-part-item], [data-part-group]");
        const nodeId = li?.getAttribute("data-part-item") || li?.getAttribute("data-part-group");
        if (!nodeId) {
          el.checked = checked.includes(id);
          return;
        }
        const findNode = (nodes) => {
          for (const n of nodes || []) {
            if (n.id === nodeId) return n;
            const sub = findNode(n.children);
            if (sub) return sub;
          }
          return null;
        };
        const node = findNode(st.partTree || []);
        if (node?.children?.length) {
          const cs = partSubtreeCheckState(node, checked);
          el.checked = cs.on;
          el.indeterminate = cs.indeterminate;
        } else {
          el.checked = checked.includes(id);
          el.indeterminate = false;
        }
      });
      host.querySelectorAll("[data-part-item], [data-part-group]").forEach((li) => {
        const id = li.getAttribute("data-part-item") || li.getAttribute("data-part-group");
        li.classList.toggle("on", id === highlight);
        li.classList.toggle("is-checked", checked.includes(id));
        li.classList.toggle("is-collapsed", partTreeCollapsed.has(id));
      });
    }

    function expandAllPartTree(nodes) {
      for (const n of nodes || []) {
        partTreeCollapsed.delete(n.id);
        if (n.children?.length) expandAllPartTree(n.children);
      }
    }

    function collapseAllPartTree(nodes) {
      for (const n of nodes || []) {
        if (n.children?.length) {
          partTreeCollapsed.add(n.id);
          collapseAllPartTree(n.children);
        }
      }
    }

    let textureSynthUiTimer = 0;
    function scheduleIslandTextureParamsFromUi(host) {
      if (!host) return;
      if (textureSynthUiTimer) clearTimeout(textureSynthUiTimer);
      textureSynthUiTimer = setTimeout(() => {
        textureSynthUiTimer = 0;
        applyIslandTextureParamsFromUi(host, true);
      }, 180);
    }

    function applyIslandTextureParamsFromUi(host, schedule = false) {
      if (!host) return;
      const seedEl = host.querySelector("#islandTextureSeed");
      const simEl = host.querySelector("#islandTextureSimilarity");
      const blockEl = host.querySelector("#islandTextureBlockScale");
      const seed = parseInt(seedEl?.value || "12345", 10) >>> 0;
      const similarity = (parseFloat(simEl?.value || "70") || 0) / 100;
      const blockScale = parseFloat(blockEl?.value || "24") || 24;
      const simVal = host.querySelector("#islandTextureSimVal");
      const blockVal = host.querySelector("#islandTextureBlockVal");
      const seedVal = host.querySelector("#islandTextureSeedVal");
      if (simVal) simVal.textContent = String(Math.round(similarity * 100));
      if (blockVal) blockVal.textContent = String(Math.round(blockScale));
      if (seedVal) seedVal.textContent = String(seed);
      boneMorph.setIslandTextureSynthParams({ seed, similarity, blockScale });
      if (schedule && (boneMorph.getState().islandChecked || []).length) {
        boneMorph.scheduleIslandTextureSynth({ immediate: true });
      }
    }

    function setupMorphPanelDelegation(host) {
      if (!elWorkspace) return;
      // 页面生命周期内只绑一次（监听挂在持久 #workspace，与 viewer dispose 无关）
      if (morphPanelDelegated) return;
      morphPanelDelegated = true;
      if (morphPanelAborter) morphPanelAborter.abort();
      morphPanelAborter = new AbortController();
      const onEv = { signal: morphPanelAborter.signal };
      elWorkspace.addEventListener("dblclick", (e) => {
        const li = e.target.closest("[data-hist]");
        if (!li) return;
        selectedHistoryId = li.getAttribute("data-hist") || "";
        loadSelectedHistoryVersion();
      }, onEv);
      elWorkspace.addEventListener("click", (e) => {
        const treeModeBtn = e.target.closest("[data-tree-mode]");
        if (treeModeBtn) return;
        const tabBtn = e.target.closest("[data-morph-tab]");
        if (tabBtn) {
          morphPanelTab = tabBtn.getAttribute("data-morph-tab") || "color";
          syncMarkerVisibilityForTab();
          fillMorphPanel();
          return;
        }
        const id = e.target.id;
        if (id === "morphModeWarp" || id === "morphModeMove" || id === "morphModeAddSym" || id === "morphModeAddAsym" || id === "morphModeBrush") {
          const modeMap = {
            morphModeWarp: "warp",
            morphModeMove: "move",
            morphModeAddSym: "addSym",
            morphModeAddAsym: "addAsym",
            morphModeBrush: "brush",
          };
          const next = modeMap[id];
          const cur = boneMorph.getAnchorToolMode?.() || boneMorph.getState().anchorToolMode || "warp";
          // 再点同一加点/笔刷模式 → 退出到拧形
          if ((next === "addSym" || next === "addAsym" || next === "brush") && cur === next) {
            boneMorph.setAnchorToolMode("warp");
          } else {
            boneMorph.setAnchorToolMode(next);
          }
          morphPanelTab = "anchors";
          fillMorphPanel();
        } else if (id === "morphBrushAdd") {
          boneMorph.setBrushSign(1);
          fillMorphPanel();
        } else if (id === "morphBrushSub") {
          boneMorph.setBrushSign(-1);
          fillMorphPanel();
        } else if (id === "morphBrushUndo") {
          boneMorph.undoBrushStroke?.();
          fillMorphPanel();
        } else if (id === "morphMirror") {
          boneMorph.setMirrorLock(!boneMorph.getState().mirrorLock);
          fillMorphPanel();
        } else if (id === "morphHslScopeAll") {
          boneMorph.setHslScope("all");
          fillMorphPanel();
        } else if (id === "morphHslScopeMuscles") {
          boneMorph.setHslScope("muscles");
          fillMorphPanel();
        } else if (id === "morphHslScopeParts") {
          boneMorph.setHslScope("parts");
          fillMorphPanel();
        } else if (id === "morphMeshColorReset") {
          boneMorph.clearSelectedMeshColor();
          fillMorphPanel();
        } else if (id === "morphColorApply") {
          (async () => {
            try {
              const r = await boneMorph.applyCommittedColorAdjustments();
              selectedHistoryId = r.historyId || "";
              document.getElementById("morphStatus").textContent = `设色已应用 · 历史 ${r.historyId}`;
              fillLeftTreePanel(boneMorph.getState());
              fillMorphPanel();
            } catch (err) {
              alert("应用设色失败：" + (err?.message || err));
            }
          })();
        } else if (id === "morphShowSelection") {
          boneMorph.toggleSelectionOverlay();
          patchMorphPanel();
        } else if (id === "islandTextureReroll") {
          applyIslandTextureParamsFromUi(document.getElementById("morphPanel"), false);
          boneMorph.randomizeIslandTextureSeed().then(() => patchMorphPanel()).catch((err) => {
            console.warn(err);
            const stEl = document.getElementById("morphStatus");
            if (stEl) stEl.textContent = `纹理合成失败：${err?.message || err}`;
            patchMorphPanel();
          });
        } else if (id === "islandTextureClear") {
          boneMorph.clearIslandTextureSynth();
          patchMorphPanel();
        } else if (id === "morphHistSave") {
          (async () => {
            const label = prompt("版本名称（可空）", "") ?? "";
            try {
              const vid = await boneMorph.saveHistoryVersion(label.trim() || undefined);
              selectedHistoryId = vid;
              document.getElementById("morphStatus").textContent = "已写入历史 " + vid;
              fillMorphPanel();
            } catch (err) {
              alert("保存历史失败：" + err.message);
            }
          })();
        } else if (id === "morphHistLoad") {
          loadSelectedHistoryVersion();
        } else if (id === "morphHistDelete") {
          deleteSelectedHistoryVersion();
        } else if (id === "morphReset") {
          boneMorph.resetMorph();
          fillMorphPanel();
        } else if (id === "partTreeExpandAll") {
          expandAllPartTree(boneMorph.getState().partTree || []);
          fillLeftTreePanel(boneMorph.getState());
        } else if (id === "partTreeCollapseAll") {
          collapseAllPartTree(boneMorph.getState().partTree || []);
          fillLeftTreePanel(boneMorph.getState());
        } else if (id === "partCheckAll" || id === "colorPartCheckAll") {
          const st2 = boneMorph.getState();
          if (id === "colorPartCheckAll") {
            boneMorph.setIslandChecked(collectAllIslandTokens(st2));
            boneMorph.setHslScope("parts");
          } else {
            boneMorph.setPartChecked(collectPartNodeIds(st2.partTree || []));
          }
          patchMorphPanel();
        } else if (id === "islandTreeExpandAll") {
          boneMorph.expandAllIslandGroups();
          patchMorphPanel();
        } else if (id === "islandTreeCollapseAll") {
          boneMorph.collapseAllIslandGroups();
          patchMorphPanel();
        } else if (id === "partCheckNone" || id === "colorPartCheckNone") {
          if (id === "colorPartCheckNone") boneMorph.setIslandChecked([]);
          else boneMorph.setPartChecked([]);
          patchMorphPanel();
        } else if (id === "partOffsetReset" || id === "islandOffsetReset") {
          boneMorph.resetIslandOffsets();
          fillMorphPanel();
        } else if (id === "morphExport") {
          exportWarpedGlb();
        }
        const li = e.target.closest("[data-hist]");
        if (li) {
          selectedHistoryId = li.getAttribute("data-hist") || "";
          syncHistoryListUi(document.getElementById("morphPanel"));
          return;
        }
        const pt = e.target.closest("[data-point]");
        if (pt) {
          boneMorph.setSelected(pt.getAttribute("data-point"));
          patchMorphPanel();
        }
        const partFold = e.target.closest("[data-part-fold]");
        if (partFold) {
          e.stopPropagation();
          const pid = partFold.getAttribute("data-part-fold");
          if (partTreeCollapsed.has(pid)) partTreeCollapsed.delete(pid);
          else partTreeCollapsed.add(pid);
          patchMorphPanel();
          return;
        }
        const partLine = e.target.closest("[data-part-name]");
        if (partLine && !e.target.matches("[data-part-check]") && !e.target.closest("[data-part-fold]")) {
          const pid = partLine.getAttribute("data-part-name");
          boneMorph.highlightPartNode(pid);
          const row = elTreeSidebar?.querySelector(`[data-part-item="${pid}"], [data-part-group="${pid}"]`);
          if (row) row.scrollIntoView({ block: "nearest", behavior: "smooth" });
          patchMorphPanel();
          return;
        }
        const islandFold = e.target.closest("[data-island-fold]");
        if (islandFold) {
          e.stopPropagation();
          boneMorph.toggleIslandTreeCollapsed(islandFold.getAttribute("data-island-fold"));
          patchMorphPanel();
          return;
        }
        const islandMeshLine = e.target.closest("[data-island-mesh-line]");
        if (islandMeshLine && !e.target.matches("[data-island-mesh-check]") && !e.target.closest("[data-island-fold]")) {
          const mk = islandMeshLine.getAttribute("data-island-mesh-line");
          boneMorph.toggleIslandTreeCollapsed(mk);
          patchMorphPanel();
          return;
        }
        const islandLine = e.target.closest("[data-island-line]");
        if (islandLine && !e.target.matches("[data-island-check]")) {
          const token = islandLine.getAttribute("data-island-line");
          boneMorph.highlightIsland(token);
          scrollIslandTreeToToken(token);
          requestAnimationFrame(() => flushIslandTreeScroll(token));
          patchMorphPanel();
          return;
        }
      }, onEv);
      elWorkspace.addEventListener("change", (e) => {
        const panel = document.getElementById("morphPanel");
        if (e.target.matches("[data-island-mesh-check]")) {
          const mk = e.target.getAttribute("data-island-mesh-check");
          boneMorph.toggleIslandMeshChecked(mk);
          if (e.target.checked) boneMorph.setHslScope("parts");
          patchMorphPanel();
          return;
        }
        if (e.target.matches("[data-island-check]")) {
          const token = e.target.getAttribute("data-island-check");
          boneMorph.toggleIslandChecked(token);
          if (e.target.checked) boneMorph.setHslScope("parts");
          patchMorphPanel();
          return;
        }
        if (e.target.matches("[data-part-check]")) {
          const pid = e.target.getAttribute("data-part-check");
          boneMorph.togglePartChecked(pid);
          if (e.target.checked) boneMorph.highlightPartNode(pid);
          patchMorphPanel();
          return;
        }
        if (e.target.id === "partTreeFilter") {
          morphPartTreeFilter = e.target.value || "";
          fillLeftTreePanel(boneMorph.getState());
          return;
        }
        if (e.target.id === "islandTreeFilter") {
          morphIslandTreeFilter = e.target.value || "";
          fillLeftTreePanel(boneMorph.getState());
          return;
        }
        if (e.target.id === "morphPointSelect") {
          boneMorph.setSelected(e.target.value);
          patchMorphPanel();
          return;
        }
        if (e.target.matches("[data-xyz]")) {
          const axis = parseInt(e.target.getAttribute("data-xyz"), 10);
          applyAnchorXyzAxis(panel, axis, parseFloat(e.target.value) || 0);
          const rangeEl = panel?.querySelector(`[data-xyz-range="${axis}"]`);
          if (rangeEl) rangeEl.value = e.target.value;
          return;
        }
        if (e.target.matches("[data-part-offset]")) {
          if (partOffsetUiSyncing) return;
          const axis = parseInt(e.target.getAttribute("data-part-offset"), 10);
          const rangeEl = panel?.querySelector(`[data-part-offset-range="${axis}"]`);
          if (rangeEl) rangeEl.value = e.target.value;
          applyPartOffsetFromUi(panel);
          return;
        }
        if (e.target.id === "morphHslH" || e.target.id === "morphHslS" || e.target.id === "morphHslL") {
          applyMorphHslFromUi(panel, true);
        }
        if (
          e.target.id === "islandTextureSimilarity" ||
          e.target.id === "islandTextureBlockScale" ||
          e.target.id === "islandTextureSeed"
        ) {
          applyIslandTextureParamsFromUi(panel, true);
        }
        if (e.target.id === "morphBrushRadius") {
          boneMorph.setBrushRadius(parseFloat(e.target.value) || 0.02);
          const v = panel?.querySelector("#morphBrushRadiusVal");
          if (v) v.textContent = Number(e.target.value).toFixed(4);
        }
        if (e.target.id === "morphBrushSoftness") {
          boneMorph.setBrushSoftness(parseFloat(e.target.value) || 0);
          const v = panel?.querySelector("#morphBrushSoftnessVal");
          if (v) v.textContent = `${Math.round((parseFloat(e.target.value) || 0) * 100)}%`;
        }
        if (e.target.id === "morphBrushStrength") {
          boneMorph.setBrushStrength(parseFloat(e.target.value) || 0.35);
          const v = panel?.querySelector("#morphBrushStrengthVal");
          if (v) v.textContent = `${Math.round((parseFloat(e.target.value) || 0) * 100)}%`;
        }
      }, onEv);
      elWorkspace.addEventListener("input", (e) => {
        const panel = document.getElementById("morphPanel");
        if (e.target.id === "islandTreeFilter") {
          morphIslandTreeFilter = e.target.value || "";
          fillLeftTreePanel(boneMorph.getState());
          return;
        }
        if (e.target.id === "partTreeFilter") {
          morphPartTreeFilter = e.target.value || "";
          fillLeftTreePanel(boneMorph.getState());
          return;
        }
        if (e.target.matches("[data-xyz-range]")) {
          const axis = parseInt(e.target.getAttribute("data-xyz-range"), 10);
          applyAnchorXyzAxis(panel, axis, parseFloat(e.target.value) || 0);
          const numEl = panel?.querySelector(`[data-xyz="${axis}"]`);
          if (numEl && document.activeElement !== numEl) numEl.value = e.target.value;
          return;
        }
        if (e.target.matches("[data-part-offset-range]")) {
          if (partOffsetUiSyncing) return;
          const axis = parseInt(e.target.getAttribute("data-part-offset-range"), 10);
          const numEl = panel?.querySelector(`[data-part-offset="${axis}"]`);
          if (numEl && document.activeElement !== numEl) numEl.value = e.target.value;
          applyPartOffsetFromUi(panel);
          return;
        }
        if (e.target.matches("[data-part-offset]")) {
          if (partOffsetUiSyncing) return;
          const axis = parseInt(e.target.getAttribute("data-part-offset"), 10);
          const rangeEl = panel?.querySelector(`[data-part-offset-range="${axis}"]`);
          if (rangeEl && document.activeElement !== rangeEl) rangeEl.value = e.target.value;
          applyPartOffsetFromUi(panel);
          return;
        }
        if (e.target.matches("[data-slider]")) {
          boneMorph.setSlider(e.target.getAttribute("data-slider"), parseFloat(e.target.value));
          const row = e.target.closest(".morph-row");
          if (row) row.querySelector(".val").textContent = Number(e.target.value).toFixed(4);
          return;
        }
        if (e.target.id === "morphHslH" || e.target.id === "morphHslS" || e.target.id === "morphHslL") {
          applyMorphHslFromUi(panel, false);
        }
        if (e.target.id === "islandTextureSimilarity" || e.target.id === "islandTextureBlockScale") {
          const panel2 = document.getElementById("morphPanel");
          const simEl = e.target.id === "islandTextureSimilarity" ? e.target : panel2?.querySelector("#islandTextureSimilarity");
          const blockEl = e.target.id === "islandTextureBlockScale" ? e.target : panel2?.querySelector("#islandTextureBlockScale");
          const simVal = panel2?.querySelector("#islandTextureSimVal");
          const blockVal = panel2?.querySelector("#islandTextureBlockVal");
          if (simVal && simEl) simVal.textContent = simEl.value;
          if (blockVal && blockEl) blockVal.textContent = blockEl.value;
          scheduleIslandTextureParamsFromUi(panel2);
        }
        if (e.target.id === "islandTextureSeed") {
          const panel2 = document.getElementById("morphPanel");
          const seedVal = panel2?.querySelector("#islandTextureSeedVal");
          if (seedVal) seedVal.textContent = e.target.value;
          scheduleIslandTextureParamsFromUi(panel2);
        }
        if (e.target.id === "morphBrushRadius") {
          boneMorph.setBrushRadius(parseFloat(e.target.value) || 0.02);
          const v = panel?.querySelector("#morphBrushRadiusVal");
          if (v) v.textContent = Number(e.target.value).toFixed(4);
        }
        if (e.target.id === "morphBrushSoftness") {
          boneMorph.setBrushSoftness(parseFloat(e.target.value) || 0);
          const v = panel?.querySelector("#morphBrushSoftnessVal");
          if (v) v.textContent = `${Math.round((parseFloat(e.target.value) || 0) * 100)}%`;
        }
        if (e.target.id === "morphBrushStrength") {
          boneMorph.setBrushStrength(parseFloat(e.target.value) || 0.35);
          const v = panel?.querySelector("#morphBrushStrengthVal");
          if (v) v.textContent = `${Math.round((parseFloat(e.target.value) || 0) * 100)}%`;
        }
      }, onEv);
    }

    function syncIslandTreeUi(host, st) {
      if (!host) return;
      host.querySelectorAll("[data-island-check]").forEach((el) => {
        const token = el.getAttribute("data-island-check");
        el.checked = (st.islandChecked || []).includes(token);
      });
      host.querySelectorAll("[data-island-item]").forEach((li) => {
        const token = li.getAttribute("data-island-item");
        li.classList.toggle("on", token === (st.islandFocusToken || ""));
        li.classList.toggle("is-checked", (st.islandChecked || []).includes(token));
      });
      host.querySelectorAll("[data-island-group]").forEach((li) => {
        const mk = li.getAttribute("data-island-group");
        const grp = (st.colorIslandGroups || []).find((g) => g.meshKey === mk);
        li.classList.toggle("is-collapsed", !!grp?.collapsed);
        li.classList.remove("has-focus");
        const meshChk = grp ? islandMeshCheckState(grp, st.islandChecked || []) : { on: false, indeterminate: false };
        const cb = li.querySelector("[data-island-mesh-check]");
        if (cb) {
          cb.checked = meshChk.on;
          cb.indeterminate = meshChk.indeterminate;
        }
      });
    }

    function leftTreeShowsIslandScanning() {
      const list = document.getElementById("leftTreeList");
      return !!list && /正在扫描几何孤岛/.test(list.textContent || "");
    }

    function syncHistoryListUi(host) {
      if (!host) return;
      host.querySelectorAll("[data-hist]").forEach((li) => {
        li.classList.toggle("on", li.getAttribute("data-hist") === selectedHistoryId);
      });
      const hasSel = !!selectedHistoryId;
      const loadBtn = host.querySelector("#morphHistLoad");
      const delBtn = host.querySelector("#morphHistDelete");
      if (loadBtn) loadBtn.disabled = !hasSel;
      if (delBtn) delBtn.disabled = !hasSel;
    }

    function ensureSelectedHistoryStillValid(st) {
      if (!selectedHistoryId) return;
      const ok = (st.history || []).some((v) => v.id === selectedHistoryId);
      if (!ok) selectedHistoryId = "";
    }

    async function loadSelectedHistoryVersion() {
      if (!selectedHistoryId) {
        alert("请先选中一条存档");
        return;
      }
      try {
        await boneMorph.loadHistoryVersion(selectedHistoryId);
        const meta = boneMorph.getState().history?.find((v) => v.id === selectedHistoryId);
        document.getElementById("morphStatus").textContent = `已加载 ${meta?.label || selectedHistoryId}`;
        fillMorphPanel();
      } catch (err) {
        alert("加载失败：" + (err?.message || err));
      }
    }

    async function deleteSelectedHistoryVersion() {
      if (!selectedHistoryId) {
        alert("请先选中一条存档");
        return;
      }
      const st = boneMorph.getState();
      const meta = (st.history || []).find((v) => v.id === selectedHistoryId);
      const label = meta?.label || selectedHistoryId;
      if (!confirm(`删除存档「${label}」？\n对应 JSON 文件将一并删除，不可恢复。`)) return;
      const hid = selectedHistoryId;
      try {
        await boneMorph.deleteHistoryVersion(hid);
        if (selectedHistoryId === hid) selectedHistoryId = "";
        document.getElementById("morphStatus").textContent = `已删除 ${label}`;
        fillMorphPanel();
      } catch (err) {
        alert("删除失败：" + (err?.message || err));
      }
    }

    function syncMarkerVisibilityForTab() {
      boneMorph.setMarkersVisible?.(morphPanelTab !== "color");
    }

    function patchMorphPanel() {
      const host = document.getElementById("morphPanel");
      if (!host || !host.querySelector("[data-morph-tab]")) {
        fillMorphPanel();
        return;
      }
      const st = boneMorph.getState();
      const pickToken = `${st.hslScope}|${(st.islandChecked || []).join(",")}`;
      if (st.hslScope === "parts" && (st.islandChecked || []).length && pickToken !== morphPanelPickToken) {
        morphPanelPickToken = pickToken;
        morphPanelTab = "color";
        fillMorphPanel();
        return;
      }
      const status = host.querySelector("#morphStatus");
      if (status) {
        const axis = st.dragAxisHint ? ` · 拖轴 ${st.dragAxisHint}` : "";
        if (morphPanelTab === "anchors") {
          const mode = st.anchorToolMode || "warp";
          const modeLabel =
            mode === "move"
              ? "移锚点"
              : mode === "addSym"
                ? "对称加点"
                : mode === "addAsym"
                  ? "单点加点"
                  : mode === "brush"
                    ? "笔刷"
                    : "拧形";
          status.textContent =
            mode === "brush"
              ? `模式：笔刷 · ${st.brushSign < 0 ? "减料" : "堆料"} · 空白拖旋转 · 按住表面刷 · Ctrl+Z撤销 · Esc退出`
              : `模式：${modeLabel} · 选中 ${st.selectedId || "—"} · 空白拖旋转 · 拖球=${mode === "move" ? "移锚点" : mode === "warp" ? "拧形" : "选中"} · Del删除 · 方向键微调${axis}`;
        } else {
          status.textContent = st.hasRest
            ? `点 ${st.pointIds.length} · 选中 ${st.selectedId || "—"}${axis}`
            : "无 rest";
        }
      }
      const mode = st.anchorToolMode || "warp";
      host.querySelector("#morphModeWarp")?.classList.toggle("on", mode === "warp");
      host.querySelector("#morphModeMove")?.classList.toggle("on", mode === "move");
      host.querySelector("#morphModeAddSym")?.classList.toggle("on", mode === "addSym");
      host.querySelector("#morphModeAddAsym")?.classList.toggle("on", mode === "addAsym");
      host.querySelector("#morphModeBrush")?.classList.toggle("on", mode === "brush");
      host.querySelector("#morphBrushAdd")?.classList.toggle("on", (st.brushSign ?? 1) >= 0);
      host.querySelector("#morphBrushSub")?.classList.toggle("on", (st.brushSign ?? 1) < 0);
      host.querySelector("#morphMirror")?.classList.toggle("on", !!st.mirrorLock);
      const pointListEl = host.querySelector("#morphPointList");
      if (pointListEl) {
        const sig = st.pointIds.join("|");
        if (pointListEl.dataset.pointSig !== sig) {
          pointListEl.dataset.pointSig = sig;
          pointListEl.innerHTML = morphPointListHtml(st);
          const ptSelRefresh = host.querySelector("#morphPointSelect");
          if (ptSelRefresh) {
            ptSelRefresh.innerHTML =
              st.pointIds
                .map((id) => {
                  const label = morphPointLabel(st, id);
                  return `<option value="${id}"${id === st.selectedId ? " selected" : ""}>${label} (${id})</option>`;
                })
                .join("") || `<option value="">暂无锚点</option>`;
          }
          const countEl = host.querySelector('[data-morph-pane="anchors"] > .lm-stat');
          if (countEl) countEl.textContent = `锚点 ${st.pointIds.length}`;
        }
      }
      updateMorphPickBanner(host, st);
      const hslNeedPick = st.hslScope === "parts" && !(st.islandChecked || []).length;
      const islandOffNeedPick = !(st.islandChecked || []).length;
      ["morphHslH", "morphHslS", "morphHslL"].forEach((id) => {
        const el = host.querySelector("#" + id);
        if (el) el.disabled = hslNeedPick;
      });
      host.querySelectorAll("[data-part-offset], [data-part-offset-range]").forEach((el) => {
        el.disabled = islandOffNeedPick;
      });
      const rh = st.regionHsl || {};
      const hEl = host.querySelector("#morphHslH");
      const sEl = host.querySelector("#morphHslS");
      const lEl = host.querySelector("#morphHslL");
      const hDeg = Math.round((rh.dh || 0) * 360);
      const sPct = Math.round((rh.ds || 0) * 100);
      const lPct = Math.round((rh.dl || 0) * 100);
      if (hEl && document.activeElement !== hEl) {
        hEl.value = String(hDeg);
        const v = host.querySelector("#morphHslHVal");
        if (v) v.textContent = `${hDeg}°`;
      }
      if (sEl && document.activeElement !== sEl) {
        sEl.value = String(sPct);
        const v = host.querySelector("#morphHslSVal");
        if (v) v.textContent = `${sPct}`;
      }
      if (lEl && document.activeElement !== lEl) {
        lEl.value = String(lPct);
        const v = host.querySelector("#morphHslLVal");
        if (v) v.textContent = `${lPct}`;
      }
      host.querySelectorAll("[data-slider]").forEach((el) => {
        if (document.activeElement === el) return;
        const sid = el.getAttribute("data-slider");
        const v = st.sliderValues[sid] ?? 0;
        el.value = v;
        const row = el.closest(".morph-row");
        if (row) row.querySelector(".val").textContent = Number(v).toFixed(4);
      });
      host.querySelectorAll("[data-morph-tab]").forEach((btn) => {
        btn.classList.toggle("on", btn.getAttribute("data-morph-tab") === morphPanelTab);
      });
      host.querySelectorAll("[data-morph-pane]").forEach((pane) => {
        pane.hidden = pane.getAttribute("data-morph-pane") !== morphPanelTab;
      });
      host.classList.toggle("color-active", morphPanelTab === "color");
      host.classList.toggle("io-active", morphPanelTab === "io");
      syncMarkerVisibilityForTab();
      host.querySelectorAll("[data-point]").forEach((li) => {
        li.classList.toggle("on", li.getAttribute("data-point") === st.selectedId);
      });
      const ptSel = host.querySelector("#morphPointSelect");
      if (ptSel && document.activeElement !== ptSel) {
        ptSel.value = st.selectedId || "";
      }
      host.querySelector("#morphHslScopeAll")?.classList.toggle("on", st.hslScope === "all");
      host.querySelector("#morphHslScopeMuscles")?.classList.toggle("on", st.hslScope === "muscles");
      host.querySelector("#morphHslScopeParts")?.classList.toggle("on", st.hslScope === "parts");
      host.querySelector("#morphShowSelection")?.classList.toggle("on", !!st.showSelectionOverlay);
      if (st.selectedId) {
        const xyz = (st.xyzOffset[st.selectedId] || [0, 0, 0]).map((n) => Number(n));
        syncAnchorXyzUi(host, xyz);
      }
      const hlChanged = (st.partHighlightId || "") !== morphPartHighlightId;
      morphPartHighlightId = st.partHighlightId || "";
      syncPartOffsetUi(host, st.islandOffset || [0, 0, 0], hlChanged);
      const focusChanged = (st.islandFocusToken || "") !== morphIslandFocusToken;
      morphIslandFocusToken = st.islandFocusToken || "";
      syncIslandTreeUi(elTreeSidebar, st);
      syncTreeModeUi();
      const texMeta = host.querySelector(".part-offset-meta");
      if (texMeta) {
        if (st.islandTextureSynthBusy) {
          texMeta.textContent = "重排本岛条纹/纤维纹理 · 合成中…";
        } else if (st.islandTextureSynthLastError) {
          texMeta.textContent = `合成失败：${st.islandTextureSynthLastError}`;
        } else {
          texMeta.textContent = `拖相似度/块尺度时请保持视角不动 · 已变体 ${st.islandTextureSynthCheckedCount || 0} 块`;
        }
      }
      const texBusy = !!st.islandTextureSynthBusy;
      host.querySelector("#islandTextureReroll")?.toggleAttribute("disabled", texBusy || !(st.islandChecked || []).length);
      host.querySelector("#islandTextureClear")?.toggleAttribute("disabled", texBusy || !(st.islandChecked || []).length);
      host.querySelector("#islandTextureSimilarity")?.toggleAttribute("disabled", texBusy || !(st.islandChecked || []).length);
      host.querySelector("#islandTextureBlockScale")?.toggleAttribute("disabled", texBusy || !(st.islandChecked || []).length);
      host.querySelector("#islandTextureSeed")?.toggleAttribute("disabled", texBusy || !(st.islandChecked || []).length);
      if (focusChanged && st.islandFocusToken) {
        scrollIslandTreeToToken(st.islandFocusToken);
        requestAnimationFrame(() => flushIslandTreeScroll(st.islandFocusToken));
      } else if (pendingIslandTreeScroll) {
        requestAnimationFrame(() => flushIslandTreeScroll(pendingIslandTreeScroll));
      }
      if (st.islandScanDone && leftTreeShowsIslandScanning()) {
        fillLeftTreePanel(st);
      }
      syncHistoryListUi(host);
    }

            <button type="button" id="islandOffsetReset">位移归零</button>
          </div>
          ${partOffsetRowHtml(0, "dx", islandOff[0], islandOffDisabled)}
          ${partOffsetRowHtml(1, "dy", islandOff[1], islandOffDisabled)}
          ${partOffsetRowHtml(2, "dz", islandOff[2], islandOffDisabled)}`;
      host.innerHTML = `
        <div class="morph-tabs">
          ${tabBtn("color", "设色")}
          ${tabBtn("anchors", "锚点")}
          ${tabBtn("io", "存档")}
        </div>
        <div class="morph-pane morph-pane-color" data-morph-pane="color"${morphPanelTab !== "color" ? " hidden" : ""}>
          ${hslPanelHtml}
        </div>
        <div class="morph-pane" data-morph-pane="anchors"${morphPanelTab !== "anchors" ? " hidden" : ""}>
          <p class="lm-stat" style="margin:0 0 6px">锚点 ${st.pointIds.length}</p>
          <ul class="morph-point-list" id="morphPointList">${pointList}</ul>
          <select class="morph-select" id="morphPointSelect" title="快速跳转">${pointOpts || `<option value="">暂无锚点</option>`}</select>
          <div class="morph-actions">
            <button type="button" id="morphModeWarp" class="${mode === "warp" ? "on" : ""}">拧形</button>
            <button type="button" id="morphModeMove" class="${mode === "move" ? "on" : ""}">移锚点</button>
            <button type="button" id="morphModeAddSym" class="${mode === "addSym" ? "on" : ""}">对称加点</button>
            <button type="button" id="morphModeAddAsym" class="${mode === "addAsym" ? "on" : ""}">单点加点</button>
            <button type="button" id="morphModeBrush" class="${mode === "brush" ? "on" : ""}">笔刷</button>
          </div>
          ${brushPanelHtml}
          <div class="morph-actions">
            <button type="button" id="morphMirror" class="${st.mirrorLock ? "on" : ""}">镜像${st.mirrorLock ? "开" : "关"}</button>
            <button type="button" id="morphReset">拧形归零</button>
          </div>
          <details class="morph-adv">
            <summary>单点 XYZ</summary>
            <div style="margin-top:6px">
              ${anchorXyzRowHtml(0, "dx", xyz[0])}
              ${anchorXyzRowHtml(1, "dy", xyz[1])}
              ${anchorXyzRowHtml(2, "dz", xyz[2])}
            </div>
          </details>
        </div>
        <div class="morph-pane morph-pane-io" data-morph-pane="io"${morphPanelTab !== "io" ? " hidden" : ""}>
          <div class="morph-io-head">
            <div class="morph-actions">
              <button type="button" id="morphHistSave">保存历史</button>
              <button type="button" id="morphHistLoad"${selectedHistoryId ? "" : " disabled"}>加载</button>
              <button type="button" id="morphHistDelete"${selectedHistoryId ? "" : " disabled"}>删除</button>
            </div>
            <p class="morph-io-hint">单击选中存档，点「加载」还原；双击列表项也可加载。每条存档对应 JSON，目录：<code>${histJsonDir}</code></p>
          </div>
          <div class="morph-history-wrap">
            <ul class="morph-history" id="morphHistList">${hist}</ul>
          </div>
          <div class="morph-io-foot morph-actions">
            <button type="button" id="morphExport">导出 GLB</button>
          </div>
        </div>
        <p class="lm-stat" id="morphStatus">${
          morphPanelTab === "anchors"
            ? mode === "brush"
              ? `模式：笔刷 · ${(st.brushSign ?? 1) < 0 ? "减料" : "堆料"} · 空白拖旋转 · 按住表面刷`
              : `模式：${modeLabel} · 选中 ${sel || "—"} · 空白拖旋转 · 拖球=${mode === "move" ? "移锚点" : mode === "warp" ? "拧形" : "选中"} · Del删除 · 方向键微调`
            : st.hasRest
              ? `点 ${st.pointIds.length} · 选中 ${sel || "—"}`
              : "无 rest"
        }</p>
      `;
      fillLeftTreePanel(st);
      setupMorphPanelDelegation(host);
      host.classList.toggle("color-active", morphPanelTab === "color");
      host.classList.toggle("io-active", morphPanelTab === "io");
      syncMarkerVisibilityForTab();
      syncHistoryListUi(host);
      morphPartHighlightId = boneMorph.getState().partHighlightId || "";
      morphIslandFocusToken = st.islandFocusToken || "";
    }

    function yieldToBrowser() {
      return new Promise((resolve) => {
        requestAnimationFrame(() => {
          setTimeout(resolve, 0);
        });
      });
    }

    function setExportProgress(pct, stepText, { busy = false } = {}) {
      const bar = document.getElementById("exportProgressBar");
      const pctEl = document.getElementById("exportProgressPct");
      const step = document.getElementById("exportStepText");
      const overlay = document.getElementById("exportOverlay");
      const v = Math.max(0, Math.min(100, pct));
      if (bar) {
        bar.classList.toggle("is-busy", !!busy);
        if (!busy) bar.style.width = `${v}%`;
      }
      if (pctEl) pctEl.textContent = busy ? "处理中…" : `${Math.round(v)}%`;
      if (step && stepText) step.textContent = stepText;
      if (overlay) overlay.setAttribute("aria-busy", busy || v < 100 ? "true" : "false");
    }

    function showExportOverlay(show) {
      const el = document.getElementById("exportOverlay");
      if (el) el.hidden = !show;
    }

    function setExportUiBusy(busy) {
      document.getElementById("morphExport")?.toggleAttribute("disabled", busy);
      document.getElementById("btnImportGlb")?.toggleAttribute("disabled", busy);
      document.getElementById("btnNewFromEuro")?.toggleAttribute("disabled", busy);
      elProjectSelect?.toggleAttribute("disabled", busy);
    }

    async function exportWarpedGlb() {
      if (exportInProgress) return;
      const root = boneMorph.getRoot();
      if (!root) {
        alert("尚未加载模型");
        return;
      }

      exportInProgress = true;
      setExportUiBusy(true);
      showExportOverlay(true);
      setExportProgress(0, "准备导出…");
      await yieldToBrowser();

      const markers = boneMorph.markerGroup();
      const restoreMarkers = () => {
        if (markers) markers.visible = morphPanelTab !== "color";
      };
      let exportUserDataStash = null;

      try {
        setExportProgress(4, "第 1/3 步：准备贴图与纹理合成…");
        await yieldToBrowser();
        try {
          await boneMorph.prepareAtlasForExport((subPct, subMsg) => {
            const mapped = 4 + (subPct / 100) * 28;
            setExportProgress(mapped, `第 1/3 步：${subMsg}`);
          });
        } catch (e) {
          console.warn("[export] texture synth flush", e);
        }

        setExportProgress(34, "第 2/3 步：正在序列化模型与编码贴图…\n此步可能需数十秒，页面暂时无响应属正常，请稍候。");
        await yieldToBrowser();
        if (markers) markers.visible = false;
        await yieldToBrowser();

        setExportProgress(36, "第 2/3 步：正在序列化模型与编码贴图…\n此步可能需数十秒，页面暂时无响应属正常，请稍候。", {
          busy: true,
        });
        await yieldToBrowser();

        const base = (currentModelLabel || "model").replace(/\.glb$/i, "");
        try {
          exportUserDataStash = boneMorph.beginGltfExportSanitize(root);
        } catch (e) {
          console.warn("[export] sanitize userData", e);
        }

        const result = await new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            reject(new Error("导出超时（超过 8 分钟）。若贴图很大，可稍后重试或联系我们优化。"));
          }, 8 * 60 * 1000);
          setTimeout(() => {
            try {
              const exporter = new GLTFExporter();
              exporter.parse(
                root,
                (data) => {
                  clearTimeout(timer);
                  resolve(data);
                },
                (err) => {
                  clearTimeout(timer);
                  reject(err);
                },
                { binary: true, maxTextureSize: 4096 }
              );
            } catch (e) {
              clearTimeout(timer);
              reject(e);
            }
          }, 16);
        });

        restoreMarkers();
        setExportProgress(90, "第 3/3 步：正在生成下载文件…", { busy: false });
        await yieldToBrowser();

        const blob =
          result instanceof ArrayBuffer
            ? new Blob([result], { type: "model/gltf-binary" })
            : new Blob([JSON.stringify(result)], { type: "application/json" });
        const sizeMb = (blob.size / (1024 * 1024)).toFixed(2);

        setExportProgress(96, `第 3/3 步：写入 ${base}_baked.glb（约 ${sizeMb} MB）…`);
        await yieldToBrowser();

        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${base}_baked.glb`;
        a.click();
        URL.revokeObjectURL(a.href);

        setExportProgress(100, `导出完成：${base}_baked.glb（${sizeMb} MB）`);
        const st = document.getElementById("morphStatus");
        if (st) st.textContent = `已下载烘焙 GLB · ${sizeMb} MB`;
        await yieldToBrowser();
        setTimeout(() => showExportOverlay(false), 800);
      } catch (err) {
        restoreMarkers();
        console.error(err);
        setExportProgress(0, `导出失败：${err?.message || err}`, { busy: false });
        showExportOverlay(false);
        alert("导出失败：" + (err?.message || err));
      } finally {
        try {
          boneMorph.endGltfExportSanitize(exportUserDataStash);
        } catch (e) {
          console.warn("[export] restore userData in finally", e);
        }
        exportInProgress = false;
        setExportUiBusy(false);
      }
    }

    document.getElementById("btnImportGlb").addEventListener("click", () => elFile.click());
    elFile.addEventListener("change", async () => {
      const file = elFile.files?.[0];
      elFile.value = "";
      if (!file) return;
      try {
        await importProjectFile(file);
      } catch (e) {
        console.error(e);
        alert("导入失败：" + e.message);
        elStatus.textContent = "导入失败";
      }
    });
    document.getElementById("btnNewFromEuro").addEventListener("click", async () => {
      try {
        await createProjectFromDefault();
      } catch (e) {
        console.error(e);
        alert("创建失败：" + e.message);
        elStatus.textContent = "创建失败";
      }
    });
    elProjectSelect?.addEventListener("change", async () => {
      if (projectBusy) return;
      const id = elProjectSelect.value;
      if (!id || id === currentProjectId) return;
      const p = projects.find((x) => x.id === id);
      if (!p) return;
      try {
        await openProject(p);
      } catch (err) {
        alert("切换工程失败：" + err.message);
      }
    });
    elBtnDeleteProject?.addEventListener("click", async () => {
      if (!currentProjectId) return;
      try {
        await deleteProject(currentProjectId);
      } catch (err) {
        alert("删除失败：" + err.message);
      }
    });

    (async function boot() {
      try {
        const data = await fetchProjects();
        const prefer =
          projects.find((p) => p.id === data.activeId) ||
          projects.find((p) => p.id === activeProjectId) ||
          projects[0];
        if (prefer) await openProject(prefer, { skipSave: true });
        else {
          elModelName.textContent = "未选择工程";
          document.getElementById("morphPanel").innerHTML =
            `<p class="lm-stat">请先导入或新建工程。</p>`;
        }
      } catch (e) {
        console.error(e);
        if (elProjectSelect) {
          elProjectSelect.innerHTML = `<option value="">工程列表加载失败</option>`;
          elProjectSelect.disabled = true;
        }
      }
    })();
  </script>
</body>
