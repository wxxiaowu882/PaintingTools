<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Base15 对照审阅</title>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
  <style>
    :root {
      --bg: #1a1c1e;
      --panel: #24272b;
      --text: #f2f2f0;
      --muted: #9aa0a6;
      --accent: #c4a574;
      --line: #3a3f45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .sub { color: var(--muted); font-size: 0.85rem; line-height: 1.45; max-width: 960px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
    label { font-size: 0.8rem; color: var(--muted); margin-right: 4px; }
    select, button {
      background: #2e3338;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 12px;
      font: inherit;
      cursor: pointer;
    }
    button.active, .chip.active {
      border-color: var(--accent);
      color: var(--accent);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: #2e3338;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      color: var(--text);
    }
    main { padding: 16px 20px 40px; }
    .mode-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .stage {
      display: grid;
      gap: 12px;
    }
    .stage.side { grid-template-columns: 1fr 1fr; }
    .stage.stack { grid-template-columns: 1fr; }
    .stage.viewer3d { grid-template-columns: 1fr 1fr; }
    .stage.morph {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(280px, 340px);
      align-items: stretch;
    }
    .stage.morph .card {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .stage.morph .viewer-host,
    .stage.morph .morph-ref-frame {
      width: 100%;
      height: min(78vh, 720px);
      min-height: 360px;
      aspect-ratio: auto;
      background: #fff;
      position: relative;
      overflow: hidden;
      flex: 1 1 auto;
    }
    .stage.morph .morph-ref-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      max-width: none;
      max-height: none;
    }
    @media (max-width: 1100px) {
      .stage.morph { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) {
      .stage.viewer3d { grid-template-columns: 1fr; }
    }
    .morph-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px 14px;
      max-height: min(78vh, 720px);
      overflow: auto;
      font-size: 0.78rem;
    }
    .morph-panel h3 {
      margin: 10px 0 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
    }
    .morph-panel h3:first-child { margin-top: 0; }
    .morph-tabs {
      display: flex;
      gap: 4px;
      margin: 0 0 10px;
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--panel);
      padding-bottom: 4px;
    }
    .morph-tabs button {
      flex: 1;
      font-size: 0.72rem;
      padding: 6px 4px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #2a2e33;
      color: var(--muted);
      cursor: pointer;
    }
    .morph-tabs button.on {
      border-color: var(--accent);
      color: var(--accent);
      background: #32383f;
    }
    .morph-pane[hidden] { display: none !important; }
    .morph-pick-banner {
      margin: 0 0 8px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #2a2e33;
      line-height: 1.35;
    }
    .morph-pick-banner strong { color: var(--accent); }
    .morph-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: center;
      margin: 4px 0;
    }
    .morph-row label { color: var(--text); font-size: 0.75rem; margin: 0; }
    .morph-row input[type="range"] { width: 100%; }
    .morph-row .val { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
    .morph-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .morph-actions button { font-size: 0.72rem; padding: 5px 8px; }
    .morph-actions button.on { border-color: var(--accent); color: var(--accent); }
    .morph-xyz { display: grid; grid-template-columns: 28px 1fr; gap: 4px 8px; align-items: center; }
    .morph-xyz input[type="number"] {
      width: 100%;
      background: #2e3338;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 4px 6px;
      font: inherit;
    }
    .morph-select {
      width: 100%;
      margin-bottom: 6px;
    }
    .morph-history {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 180px;
      overflow: auto;
    }
    .morph-history li {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
      margin: 4px 0;
      cursor: pointer;
      background: #2a2e33;
    }
    .morph-history li:hover { border-color: var(--accent); }
    .morph-history .meta { color: var(--muted); font-size: 0.68rem; }
    .morph-history .del {
      float: right;
      font-size: 0.68rem;
      padding: 2px 6px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .card h2 {
      margin: 0;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .card h2 span { color: var(--muted); font-weight: 400; font-size: 0.78rem; }
    .frame {
      background: #fff;
      min-height: 280px;
      aspect-ratio: 1 / 1;
      position: relative;
      overflow: hidden;
    }
    .frame img {
      position: absolute;
      max-width: none;
      max-height: none;
      display: block;
      pointer-events: none;
    }
    .lm-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: all;
      overflow: visible;
    }
    .lm-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 4px 6px;
      background: #1e293b;
      border-radius: 6px 6px 0 0;
      font-size: 0.72rem;
      color: #cbd5e1;
    }
    .lm-bar select, .lm-bar button {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      cursor: pointer;
    }
    .lm-stat { color: #94a3b8; }
    #lmToggle.active { background: #16a34a; color: #fff; }
    .viewer-host {
      width: 100%;
      height: min(78vh, 720px);
      background: #fff;
      position: relative;
    }
    .viewer-host canvas { display: block; width: 100% !important; height: 100% !important; }
    .viewer-status {
      position: absolute;
      left: 12px;
      bottom: 12px;
      font-size: 0.78rem;
      color: var(--muted);
      background: rgba(0,0,0,0.45);
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
    }
    .slider-wrap {
      position: relative;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      background: #fff;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }
    .slider-wrap .layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .frame img,
    .slider-wrap img {
      position: absolute;
      max-width: none;
      max-height: none;
      pointer-events: none;
    }
    .slider-wrap .top { clip-path: inset(0 50% 0 0); }
    .slider-wrap .handle {
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 2px;
      background: var(--accent);
      transform: translateX(-50%);
    }
    .slider-wrap .handle::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 28px; height: 28px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: rgba(26, 28, 30, 0.85);
    }
    .hint { color: var(--muted); font-size: 0.8rem; margin-top: 8px; text-align: center; }
    .note {
      margin-top: 18px;
      padding: 12px 14px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .chip.aux { opacity: 0.72; border-style: dashed; }
    .view-sep {
      font-size: 0.72rem;
      color: var(--muted);
      padding: 6px 4px 6px 8px;
      align-self: center;
    }
    @media (max-width: 860px) {
      .stage.side { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Base15 ↔ 当前成果 对照审阅</h1>
    <p class="sub">主审视角：<strong>正 / 侧 / 背</strong>（大型比例验收）。前侧/后侧仅辅助参考。均为正交取景，与 Base15 一致。</p>
    <div class="row">
      <label>候选版本</label>
      <select id="cand"></select>
      <label>视角</label>
      <div class="chips" id="views"></div>
    </div>
    <div class="row mode-bar">
      <button type="button" class="active" data-mode="side">并排对照</button>
      <button type="button" data-mode="slider">拖拽叠图</button>
      <button type="button" data-mode="stack">上下对照</button>
      <button type="button" data-mode="viewer3d">3D预览 GLB</button>
      <button type="button" data-mode="morph">骨相拧形</button>
      <button type="button" id="lmToggle">锚点叠层 ⊕</button>
    </div>
  </header>
  <main>
    <div id="stage" class="stage side"></div>
    <div id="lmToolbar"></div>
    <p class="hint" id="hint"></p>
    <p class="hint" style="opacity:0.55;font-size:0.72rem">对照页 v8 · 白底3D正交截取 · Base15调色 · 默认 SHELL_v8</p>
    <div class="note" id="candNote"></div>
  </main>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "./vendor/controls/OrbitControls.js";
    import { GLTFLoader } from "./vendor/loaders/GLTFLoader.js";
    import { DRACOLoader } from "./vendor/loaders/DRACOLoader.js";
    import { createLandmarkController } from "./landmarks.js";
    import { createBoneMorphController } from "./bone_morph.js";
    import { GLTFExporter } from "./vendor/exporters/GLTFExporter.js";

    const PRIMARY_VIEWS = [
      { id: "front", label: "正" },
      { id: "side", label: "侧" },
      { id: "back", label: "背" },
    ];
    const AUX_VIEWS = [
      { id: "front_three_quarter", label: "前侧" },
      { id: "rear_three_quarter", label: "后侧" },
    ];
    const VIEWS = [...PRIMARY_VIEWS, ...AUX_VIEWS];
    const FALLBACK_CANDS = [
      { id: "SKULL_v2", note: "人眼纠偏：加宽+略收前后", glb: true },
      { id: "SKULL_v1", note: "上版正/顶别扭", glb: true },
      { id: "PROP_v2", note: "已废弃坏例", glb: true },
    ];
    const GLB_CANDS = new Set(["SKULL_v2", "SKULL_v1", "PROP_v1", "PROP_v2"]);

    let cands = FALLBACK_CANDS.slice();
    let viewId = "front";
    let mode = "side";
    let candId = "PROP_v2";
    const boneMorph = createBoneMorphController(THREE);
    let morphBusy = false;

    const elCand = document.getElementById("cand");
    const elViews = document.getElementById("views");
    const elStage = document.getElementById("stage");
    const elHint = document.getElementById("hint");
    const elNote = document.getElementById("candNote");

    let viewers = [];
    let syncingOrbit = false;
    let alignCache = new Map();
    let alignObservers = [];

    const lmc = createLandmarkController(THREE);
    let lmActive = false;
    lmc.setOnRefresh(() => mountLandmarks());

    let assetRev = "";

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function cornerBg(data, sw, sh) {
      const pts = [[0, 0], [sw - 1, 0], [0, sh - 1], [sw - 1, sh - 1]];
      let r = 0;
      let g = 0;
      let b = 0;
      for (const [x, y] of pts) {
        const i = (y * sw + x) * 4;
        r += data[i];
        g += data[i + 1];
        b += data[i + 2];
      }
      return { r: r / 4, g: g / 4, b: b / 4 };
    }

    function isForeground(i, data, bg, minDelta = 14) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];
      const a = data[i + 3];
      if (a < 8) return false;
      const dr = Math.abs(r - bg.r);
      const dg = Math.abs(g - bg.g);
      const db = Math.abs(b - bg.b);
      return dr + dg + db > minDelta;
    }

    function analyzeImage(img) {
      const maxSide = 1200;
      let sw = img.naturalWidth;
      let sh = img.naturalHeight;
      if (sw < 1 || sh < 1) {
        return { left: 0, top: 0, right: 1, bottom: 1, w: 1, h: 1, cx: 0.5, cy: 0.5, span: 1 };
      }
      if (Math.max(sw, sh) > maxSide) {
        const ds = maxSide / Math.max(sw, sh);
        sw = Math.max(1, Math.round(sw * ds));
        sh = Math.max(1, Math.round(sh * ds));
      }
      const canvas = document.createElement("canvas");
      canvas.width = sw;
      canvas.height = sh;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, sw, sh);
      const data = ctx.getImageData(0, 0, sw, sh).data;
      const bg = cornerBg(data, sw, sh);

      let minX = sw;
      let minY = sh;
      let maxX = 0;
      let maxY = 0;
      let found = false;
      for (let y = 0; y < sh; y++) {
        for (let x = 0; x < sw; x++) {
          if (!isForeground((y * sw + x) * 4, data, bg)) continue;
          found = true;
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
        }
      }
      if (!found) {
        return { left: 0, top: 0, right: 1, bottom: 1, w: 1, h: 1, cx: 0.5, cy: 0.5, span: 1 };
      }

      const x0 = Math.floor(sw * 0.22);
      const x1 = Math.ceil(sw * 0.78);
      let headTop = sh;
      let headBottom = -1;
      let cxSum = 0;
      let cxCount = 0;
      for (let y = 0; y < sh; y++) {
        let rowCount = 0;
        let rowXSum = 0;
        for (let x = x0; x < x1; x++) {
          if (!isForeground((y * sw + x) * 4, data, bg)) continue;
          rowCount++;
          rowXSum += x;
        }
        if (rowCount >= 4) {
          headTop = Math.min(headTop, y);
          headBottom = Math.max(headBottom, y);
          cxSum += rowXSum / rowCount;
          cxCount++;
        }
      }
      if (headBottom < 0) {
        headTop = minY;
        headBottom = maxY;
        cxSum = (minX + maxX) * 0.5;
        cxCount = 1;
      }

      const top = headTop / sh;
      const bottom = (headBottom + 1) / sh;
      const left = minX / sw;
      const right = (maxX + 1) / sw;
      const span = bottom - top;
      const cx = (cxSum / Math.max(cxCount, 1)) / sw;
      const cy = (top + bottom) * 0.5;
      return { left, top, right, bottom, w: right - left, h: span, cx, cy, span };
    }

    async function fetchJson(url) {
      try {
        const r = await fetch(url);
        if (!r.ok) return null;
        return await r.json();
      } catch {
        return null;
      }
    }

    function pickBox(meta, view) {
      if (meta && meta[view] && typeof meta[view].span === "number") return meta[view];
      return null;
    }

    async function getAlignPair(baseSrc, oursSrc) {
      const key = `${viewId}|${candId}|${baseSrc}|${oursSrc}`;
      if (alignCache.has(key)) return alignCache.get(key);
      const [baseImg, oursImg] = await Promise.all([loadImage(baseSrc), loadImage(oursSrc)]);
      // 大型对齐必须基于「PNG 可见轮廓」，不能用 Blender 3D 框（斜视图可差 10%+）
      const refBox = analyzeImage(baseImg);
      const baseBox = refBox;
      const oursBox = analyzeImage(oursImg);
      const pair = { baseImg, oursImg, refBox, baseBox, oursBox, source: { ref: "pixels", ours: "pixels" } };
      alignCache.set(key, pair);
      return pair;
    }

    function clearAlignObservers() {
      alignObservers.forEach((ro) => ro.disconnect());
      alignObservers = [];
    }

    function applyAlignedImage(host, imgEl, img, bbox, refBox) {
      const paint = () => {
        const w = host.clientWidth;
        const h = host.clientHeight;
        if (w < 2 || h < 2 || img.naturalWidth < 1 || img.naturalHeight < 1) return;
        const refSpan = (refBox.span || refBox.h) * h;
        const srcSpan = (bbox.span || bbox.h) * img.naturalHeight;
        const scale = refSpan / Math.max(srcSpan, 1);
        const dispW = img.naturalWidth * scale;
        const dispH = img.naturalHeight * scale;
        const left = (refBox.cx || 0.5) * w - (bbox.cx || 0.5) * dispW;
        const top = refBox.top * h - bbox.top * dispH;
        imgEl.style.width = `${dispW}px`;
        imgEl.style.height = `${dispH}px`;
        imgEl.style.left = `${left}px`;
        imgEl.style.top = `${top}px`;
        imgEl.dataset.headTop = String(refBox.top * h);
        imgEl.dataset.headBottom = String(refBox.bottom * h);
      };
      const schedule = () => requestAnimationFrame(() => requestAnimationFrame(paint));
      schedule();
      imgEl.addEventListener("load", schedule);
      const ro = new ResizeObserver(schedule);
      ro.observe(host);
      if (host.parentElement) ro.observe(host.parentElement);
      alignObservers.push(ro);
    }

    function mountAlignedFrame(host, img, bbox, refBox) {
      host.innerHTML = "";
      const imgEl = document.createElement("img");
      imgEl.alt = host.dataset.label || "";
      imgEl.src = img.src;
      imgEl.decoding = "async";
      host.appendChild(imgEl);
      applyAlignedImage(host, imgEl, img, bbox, refBox);
    }

    function baseUrl(view) { return `base15/${view}.png${assetRev ? "?v=" + assetRev : ""}`; }
    function oursUrl(cand, view) { return `ours/${cand}/muscle_${view}.png${assetRev ? "?v=" + assetRev : ""}`; }
    function glbUrl(cand) { return `glb/${cand}.glb${assetRev ? "?v=" + assetRev : ""}`; }
    function hasGlb(cand) {
      const c = cands.find((x) => x.id === cand);
      if (c && typeof c.glb === "boolean") return c.glb;
      return GLB_CANDS.has(cand);
    }

    function isPrimaryView(id) {
      return PRIMARY_VIEWS.some((v) => v.id === id);
    }

    function fillControls() {
      elCand.innerHTML = cands.map((c) => `<option value="${c.id}">${c.id}${hasGlb(c.id) ? " ·GLB" : ""}</option>`).join("");
      elCand.value = candId;
      const chip = (v, aux) =>
        `<button type="button" class="chip${aux ? " aux" : ""}${v.id === viewId ? " active" : ""}" data-view="${v.id}">${v.label}</button>`;
      elViews.innerHTML =
        PRIMARY_VIEWS.map((v) => chip(v, false)).join("") +
        `<span class="view-sep">辅助</span>` +
        AUX_VIEWS.map((v) => chip(v, true)).join("");
    }

    function viewHint() {
      if (mode === "viewer3d") return "";
      if (mode === "morph") {
        return "骨相拧形：欧版中性底 + Farkas 控制点/语义滑块。右栏对照 Base15（切正/侧/背）。可自加点。";
      }
      if (!isPrimaryView(viewId)) {
        return "辅助视角（前侧/后侧）：相机角与 Base15 画稿未必一致，勿作大型比例硬结论。请以正/侧/背为准。";
      }
      return mode === "side"
        ? "主审「正/侧/背」：同一显示尺度（头顶/下巴对齐 Base15），优先看大型比例。"
        : mode === "slider"
          ? "主审视角：头顶/下巴已对齐；拖中间线看轮廓差。"
          : "主审视角：上下排列，同一显示尺度。";
    }

    function currentNote() {
      const c = cands.find((x) => x.id === candId);
      return c ? c.note || "" : "";
    }

    function euroGlbUrl() {
      // 对照源：参考用_欧洲人头部肌肉_20260324204416_opt.glb（副本 glb/euro_ref.glb）
      return `glb/euro_ref.glb${assetRev ? "?v=" + assetRev : ""}`;
    }

    function makeGltfLoader() {
      const loader = new GLTFLoader();
      const draco = new DRACOLoader();
      draco.setDecoderPath("./vendor/draco/gltf/");
      loader.setDRACOLoader(draco);
      return loader;
    }

    function disposeViewer() {
      boneMorph.dispose();
      for (const v of viewers) {
        cancelAnimationFrame(v.raf);
        if (v.controls) v.controls.dispose();
        if (v.renderer) v.renderer.dispose();
        if (v.ro) v.ro.disconnect();
      }
      viewers = [];
      syncingOrbit = false;
    }

    let morphPanelTab = "morph";
    let morphPanelPickToken = "";
    let morphPanelDelegated = false;

    function morphPickBannerHtml(st) {
      if (st.pickMuscleMode) {
        return `<div class="morph-pick-banner" id="morphPickBanner">选部中：点击模型上的色块部件（已禁用旋转）</div>`;
      }
      if (st.hslScope === "selected" && st.selectedMeshKey && st.selectedRegionKey) {
        const mesh = (st.meshes || []).find((m) => m.key === st.selectedMeshKey);
        const name = st.selectedPartLabel || st.selectedRegionHex || "部件";
        const px = st.selectedRegionPixels ? ` · ${st.selectedRegionPixels}px` : "";
        return `<div class="morph-pick-banner" id="morphPickBanner">已选：<strong>${name}</strong>${px}<br/><span style="color:var(--muted)">${mesh?.name || st.selectedMeshKey}</span></div>`;
      }
      if (st.hslScope === "selected") {
        return `<div class="morph-pick-banner" id="morphPickBanner" style="color:var(--muted)">作用域「选定」：直接点击模型色块，或点「选部」/ Alt+点击</div>`;
      }
      return "";
    }

    function updateMorphPickBanner(host, st) {
      const html = morphPickBannerHtml(st);
      const el = host.querySelector("#morphPickBanner");
      if (!html) {
        el?.remove();
        return;
      }
      if (el) el.outerHTML = html;
      else host.querySelector('[data-morph-pane="color"]')?.insertAdjacentHTML("afterbegin", html);
    }

    function setupMorphPanelDelegation(host) {
      if (morphPanelDelegated || !host) return;
      morphPanelDelegated = true;
      host.addEventListener("click", (e) => {
        const tabBtn = e.target.closest("[data-morph-tab]");
        if (tabBtn) {
          morphPanelTab = tabBtn.getAttribute("data-morph-tab") || "morph";
          fillMorphPanel();
          return;
        }
        const id = e.target.id;
        if (id === "morphAdd") {
          boneMorph.setAddMode(true, true);
          fillMorphPanel();
        } else if (id === "morphAddAsym") {
          boneMorph.setAddMode(true, false);
          fillMorphPanel();
        } else if (id === "morphDel") {
          boneMorph.deletePoint(boneMorph.getState().selectedId);
          fillMorphPanel();
        } else if (id === "morphMirror") {
          boneMorph.setMirrorLock(!boneMorph.getState().mirrorLock);
          fillMorphPanel();
        } else if (id === "morphEditRest") {
          boneMorph.setEditRest(!boneMorph.getState().editRest);
          fillMorphPanel();
        } else if (id === "morphPickMesh") {
          boneMorph.setPickMuscleMode(!boneMorph.getState().pickMuscleMode);
          morphPanelTab = "color";
          fillMorphPanel();
        } else if (id === "morphHslScopeAll") {
          boneMorph.setHslScope("all");
          fillMorphPanel();
        } else if (id === "morphHslScopeMuscles") {
          boneMorph.setHslScope("muscles");
          fillMorphPanel();
        } else if (id === "morphHslScopeSelected") {
          boneMorph.setHslScope("selected");
          morphPanelTab = "color";
          fillMorphPanel();
        } else if (id === "morphMeshColorReset") {
          boneMorph.clearSelectedMeshColor();
          fillMorphPanel();
        } else if (id === "morphHistSave") {
          (async () => {
            const label = prompt("版本名称（可空）", "") ?? "";
            try {
              const vid = await boneMorph.saveHistoryVersion(label.trim() || undefined);
              document.getElementById("morphStatus").textContent = "已写入历史 " + vid;
              fillMorphPanel();
            } catch (err) {
              alert("保存历史失败：" + err.message);
            }
          })();
        } else if (id === "morphReset") {
          boneMorph.resetMorph();
          fillMorphPanel();
        } else if (id === "morphReseed") {
          if (!confirm("用 Static 表面极值重新播种 rest，并清零拧形？")) return;
          boneMorph.reseed();
          fillMorphPanel();
        } else if (id === "morphSaveRest") {
          boneMorph.saveRest().then(
            () => {
              document.getElementById("morphStatus").textContent = "rest 已保存";
            },
            (err) => alert("保存 rest 失败：" + err.message)
          );
        } else if (id === "morphSaveSession") {
          boneMorph.saveSession().then(
            () => {
              document.getElementById("morphStatus").textContent = "session 已保存";
            },
            (err) => alert("保存 session 失败：" + err.message)
          );
        } else if (id === "morphExport") {
          exportWarpedGlb();
        }
        const del = e.target.closest("[data-hist-del]");
        if (del) {
          e.stopPropagation();
          const hid = del.getAttribute("data-hist-del");
          if (!confirm("删除该历史版本？")) return;
          boneMorph.deleteHistoryVersion(hid).then(
            () => fillMorphPanel(),
            (err) => alert(err.message)
          );
          return;
        }
        const li = e.target.closest("[data-hist]");
        if (li) {
          const hid = li.getAttribute("data-hist");
          boneMorph.loadHistoryVersion(hid).then(
            () => {
              document.getElementById("morphStatus").textContent = "已加载 " + hid;
              fillMorphPanel();
            },
            (err) => alert("加载失败：" + err.message)
          );
        }
      });
      host.addEventListener("change", (e) => {
        if (e.target.id === "morphPointSelect") {
          boneMorph.setSelected(e.target.value);
          patchMorphPanel();
          return;
        }
        if (e.target.matches("[data-xyz]")) {
          const st2 = boneMorph.getState();
          const pid = st2.selectedId;
          if (!pid) return;
          const cur = (st2.xyzOffset[pid] || [0, 0, 0]).slice();
          cur[parseInt(e.target.getAttribute("data-xyz"), 10)] = parseFloat(e.target.value) || 0;
          boneMorph.setXyz(pid, cur[0], cur[1], cur[2]);
          return;
        }
        if (e.target.id === "morphHslH" || e.target.id === "morphHslS" || e.target.id === "morphHslL") {
          applyMorphHslFromUi(host, true);
        }
      });
      host.addEventListener("input", (e) => {
        if (e.target.matches("[data-slider]")) {
          boneMorph.setSlider(e.target.getAttribute("data-slider"), parseFloat(e.target.value));
          const row = e.target.closest(".morph-row");
          if (row) row.querySelector(".val").textContent = Number(e.target.value).toFixed(4);
          return;
        }
        if (e.target.id === "morphHslH" || e.target.id === "morphHslS" || e.target.id === "morphHslL") {
          applyMorphHslFromUi(host, false);
        }
      });
    }

    function applyMorphHslFromUi(host, notify) {
      const h = parseFloat(host.querySelector("#morphHslH")?.value || "0");
      const s = parseFloat(host.querySelector("#morphHslS")?.value || "0");
      const l = parseFloat(host.querySelector("#morphHslL")?.value || "0");
      const hv = host.querySelector("#morphHslHVal");
      const sv = host.querySelector("#morphHslSVal");
      const lv = host.querySelector("#morphHslLVal");
      if (hv) hv.textContent = `${Math.round(h)}°`;
      if (sv) sv.textContent = `${Math.round(s)}`;
      if (lv) lv.textContent = `${Math.round(l)}`;
      boneMorph.setScopeHsl(h / 360, s / 100, l / 100, {
        notify,
        immediate: !!notify,
      });
    }

    function patchMorphPanel() {
      const host = document.getElementById("morphPanel");
      if (!host || !host.querySelector("[data-morph-tab]")) {
        fillMorphPanel();
        return;
      }
      const st = boneMorph.getState();
      const pickToken = `${st.selectedMeshKey}|${st.selectedRegionKey}`;
      if (st.selectedRegionKey && pickToken !== morphPanelPickToken) {
        morphPanelPickToken = pickToken;
        morphPanelTab = "color";
        fillMorphPanel();
        return;
      }
      const status = host.querySelector("#morphStatus");
      if (status) {
        status.textContent = st.hasRest
          ? `点 ${st.pointIds.length} · 选中 ${st.selectedId || "—"}`
          : "无 rest";
      }
      updateMorphPickBanner(host, st);
      const hslNeedPick =
        st.hslScope === "selected" && !(st.selectedMeshKey && st.selectedRegionKey);
      ["morphHslH", "morphHslS", "morphHslL"].forEach((id) => {
        const el = host.querySelector("#" + id);
        if (el) el.disabled = hslNeedPick;
      });
      const rh = st.regionHsl || {};
      const hEl = host.querySelector("#morphHslH");
      const sEl = host.querySelector("#morphHslS");
      const lEl = host.querySelector("#morphHslL");
      const hDeg = Math.round((rh.dh || 0) * 360);
      const sPct = Math.round((rh.ds || 0) * 100);
      const lPct = Math.round((rh.dl || 0) * 100);
      if (hEl && document.activeElement !== hEl) {
        hEl.value = String(hDeg);
        const v = host.querySelector("#morphHslHVal");
        if (v) v.textContent = `${hDeg}°`;
      }
      if (sEl && document.activeElement !== sEl) {
        sEl.value = String(sPct);
        const v = host.querySelector("#morphHslSVal");
        if (v) v.textContent = `${sPct}`;
      }
      if (lEl && document.activeElement !== lEl) {
        lEl.value = String(lPct);
        const v = host.querySelector("#morphHslLVal");
        if (v) v.textContent = `${lPct}`;
      }
      host.querySelectorAll("[data-slider]").forEach((el) => {
        if (document.activeElement === el) return;
        const sid = el.getAttribute("data-slider");
        const v = st.sliderValues[sid] ?? 0;
        el.value = v;
        const row = el.closest(".morph-row");
        if (row) row.querySelector(".val").textContent = Number(v).toFixed(4);
      });
      host.querySelectorAll("[data-morph-tab]").forEach((btn) => {
        btn.classList.toggle("on", btn.getAttribute("data-morph-tab") === morphPanelTab);
      });
      host.querySelectorAll("[data-morph-pane]").forEach((pane) => {
        pane.hidden = pane.getAttribute("data-morph-pane") !== morphPanelTab;
      });
      host.querySelector("#morphPickMesh")?.classList.toggle("on", st.pickMuscleMode);
      host.querySelector("#morphHslScopeAll")?.classList.toggle("on", st.hslScope === "all");
      host.querySelector("#morphHslScopeMuscles")?.classList.toggle("on", st.hslScope === "muscles");
      host.querySelector("#morphHslScopeSelected")?.classList.toggle("on", st.hslScope === "selected");
    }

    function fillMorphPanel() {
      const host = document.getElementById("morphPanel");
      if (!host) return;
      const st = boneMorph.getState();
      const sel = st.selectedId;
      const xyz = (st.xyzOffset[sel] || [0, 0, 0]).map((n) => Number(n.toFixed(5)));
      const pointOpts = st.pointIds
        .map((id) => {
          const lm = (st.farkas.landmarks || []).find((l) => l.id === id);
          const custom = st.customMeta[id];
          const label = lm?.label || custom?.label || id;
          return `<option value="${id}"${id === sel ? " selected" : ""}>${label} (${id})</option>`;
        })
        .join("");
      const sliders = (st.sliderDefs.sliders || [])
        .map((s) => {
          const v = st.sliderValues[s.id] ?? s.default ?? 0;
          return `<div class="morph-row">
            <label title="${s.measure || ""}">${s.label}</label>
            <span class="val">${Number(v).toFixed(4)}</span>
            <input type="range" data-slider="${s.id}" min="${s.min}" max="${s.max}" step="${s.step}" value="${v}" style="grid-column:1/-1" />
          </div>`;
        })
        .join("");
      const hist = (st.history || [])
        .map(
          (v) => `<li data-hist="${v.id}">
            <button type="button" class="del" data-hist-del="${v.id}">删</button>
            <div><strong>${v.label || v.id}</strong></div>
            <div class="meta">${(v.createdAt || "").replace("T", " ").slice(0, 19)} · ${v.pointCount || "?"}点 · ${v.sliderSummary || ""}</div>
          </li>`
        )
        .join("") || `<li class="meta" style="cursor:default">暂无历史版本</li>`;
      const hslDisabled =
        st.hslScope === "selected" && !(st.selectedMeshKey && st.selectedRegionKey);
      const tabBtn = (id, label) =>
        `<button type="button" data-morph-tab="${id}" class="${morphPanelTab === id ? "on" : ""}">${label}</button>`;
      const pickToken = `${st.selectedMeshKey}|${st.selectedRegionKey}`;
      if (st.selectedRegionKey) morphPanelPickToken = pickToken;
      host.innerHTML = `
        <div class="morph-tabs">
          ${tabBtn("morph", "拧形")}
          ${tabBtn("color", "设色")}
          ${tabBtn("io", "存档")}
        </div>
        <div class="morph-pane" data-morph-pane="morph"${morphPanelTab !== "morph" ? " hidden" : ""}>
          <h3>语义滑块（Farkas 测量）</h3>
          <p style="color:var(--muted);margin:0 0 8px;line-height:1.4">以欧版中性姿为 0；不对齐 SHELL。拖控制点仅沿世界 X/Y/Z 正交轴。</p>
          ${sliders || "<p class='lm-stat'>滑块定义未加载</p>"}
          <h3>控制点</h3>
          <select class="morph-select" id="morphPointSelect">${pointOpts}</select>
          <div class="morph-actions">
            <button type="button" id="morphAdd" class="${st.addMode ? "on" : ""}">加点${st.addSymmetric ? "(对称)" : ""}</button>
            <button type="button" id="morphAddAsym">加点(单)</button>
            <button type="button" id="morphDel">删当前</button>
            <button type="button" id="morphMirror" class="${st.mirrorLock ? "on" : ""}">镜像${st.mirrorLock ? "开" : "关"}</button>
            <button type="button" id="morphEditRest" class="${st.editRest ? "on" : ""}">${st.editRest ? "拖rest" : "拖目标"}</button>
          </div>
          <details class="morph-adv">
            <summary>单点 XYZ 偏移</summary>
            <div class="morph-xyz" style="margin-top:6px">
              <span>dx</span><input type="number" step="0.0005" data-xyz="0" value="${xyz[0]}" />
              <span>dy</span><input type="number" step="0.0005" data-xyz="1" value="${xyz[1]}" />
              <span>dz</span><input type="number" step="0.0005" data-xyz="2" value="${xyz[2]}" />
            </div>
          </details>
        </div>
        <div class="morph-pane" data-morph-pane="color"${morphPanelTab !== "color" ? " hidden" : ""}>
          ${morphPickBannerHtml(st)}
          <p style="color:var(--muted);margin:0 0 6px;line-height:1.35">作用域：<strong>全部</strong>=所有贴图；<strong>所有肌肉</strong>=肌层整张；<strong>选定</strong>=语义色块整块。滑条像 PS Ctrl+U。</p>
          <div class="morph-actions">
            <button type="button" id="morphHslScopeAll" class="${st.hslScope === "all" ? "on" : ""}">全部</button>
            <button type="button" id="morphHslScopeMuscles" class="${st.hslScope === "muscles" ? "on" : ""}">所有肌肉</button>
            <button type="button" id="morphHslScopeSelected" class="${st.hslScope === "selected" ? "on" : ""}">选定</button>
          </div>
          <div class="morph-actions">
            <button type="button" id="morphPickMesh" class="${st.pickMuscleMode ? "on" : ""}">选部</button>
            <button type="button" id="morphMeshColorReset">恢复原色</button>
          </div>
          <div class="morph-row" style="margin-top:6px">
            <label>色相</label>
            <span class="val" id="morphHslHVal">${Math.round((st.regionHsl?.dh || 0) * 360)}°</span>
            <input type="range" id="morphHslH" min="-180" max="180" step="1" value="${Math.round((st.regionHsl?.dh || 0) * 360)}" style="grid-column:1/-1"${hslDisabled ? " disabled" : ""} />
          </div>
          <div class="morph-row">
            <label>饱和度</label>
            <span class="val" id="morphHslSVal">${Math.round((st.regionHsl?.ds || 0) * 100)}</span>
            <input type="range" id="morphHslS" min="-100" max="100" step="1" value="${Math.round((st.regionHsl?.ds || 0) * 100)}" style="grid-column:1/-1"${hslDisabled ? " disabled" : ""} />
          </div>
          <div class="morph-row">
            <label>明度</label>
            <span class="val" id="morphHslLVal">${Math.round((st.regionHsl?.dl || 0) * 100)}</span>
            <input type="range" id="morphHslL" min="-100" max="100" step="1" value="${Math.round((st.regionHsl?.dl || 0) * 100)}" style="grid-column:1/-1"${hslDisabled ? " disabled" : ""} />
          </div>
        </div>
        <div class="morph-pane" data-morph-pane="io"${morphPanelTab !== "io" ? " hidden" : ""}>
          <h3>历史版本</h3>
          <div class="morph-actions">
            <button type="button" id="morphHistSave">保存到历史</button>
          </div>
          <ul class="morph-history" id="morphHistList">${hist}</ul>
          <h3>存档 / 导出</h3>
          <div class="morph-actions">
            <button type="button" id="morphReset">Reset 拧形</button>
            <button type="button" id="morphReseed">重新播种 rest</button>
            <button type="button" id="morphSaveRest">保存 rest</button>
            <button type="button" id="morphSaveSession">保存 session</button>
            <button type="button" id="morphExport">下载 warped GLB</button>
          </div>
        </div>
        <p class="lm-stat" id="morphStatus">${st.hasRest ? `点 ${st.pointIds.length} · 选中 ${sel || "—"}` : "无 rest"}</p>
      `;
      setupMorphPanelDelegation(host);
    }

    function exportWarpedGlb() {
      const root = boneMorph.getRoot();
      if (!root) {
        alert("尚未加载模型");
        return;
      }
      const markers = boneMorph.markerGroup();
      if (markers) markers.visible = false;
      const exporter = new GLTFExporter();
      exporter.parse(
        root,
        (result) => {
          if (markers) markers.visible = true;
          const blob =
            result instanceof ArrayBuffer
              ? new Blob([result], { type: "model/gltf-binary" })
              : new Blob([JSON.stringify(result)], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "euro_bone_morph_warped.glb";
          a.click();
          URL.revokeObjectURL(a.href);
          const st = document.getElementById("morphStatus");
          if (st) st.textContent = "已下载 warped GLB";
        },
        (err) => {
          if (markers) markers.visible = true;
          console.error(err);
          alert("导出失败：" + (err?.message || err));
        },
        { binary: true }
      );
    }

    function mountMorphBaseRef() {
      const host = document.getElementById("morphBaseFrame");
      if (!host) return;
      const v = ["front", "side", "back"].includes(viewId) ? viewId : "side";
      host.innerHTML = "";
      const img = document.createElement("img");
      img.alt = "Base15";
      img.src = baseUrl(v);
      host.appendChild(img);
    }

    async function initMorphViewer(host, statusEl) {
      const w = host.clientWidth || 800;
      const h = host.clientHeight || 560;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);
      const aspect = w / Math.max(h, 1);
      const camera = new THREE.OrthographicCamera(-aspect, aspect, 1, -1, -1000, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.LinearToneMapping;
      renderer.toneMappingExposure = 1.35;
      host.innerHTML = "";
      host.appendChild(renderer.domElement);
      if (statusEl) host.appendChild(statusEl);

      const hemi = new THREE.HemisphereLight(0xffffff, 0xd0d0d0, 1.35);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xffffff, 1.25);
      dir.position.set(2.2, 3.5, 2.8);
      scene.add(dir);
      const fill = new THREE.DirectionalLight(0xffffff, 0.7);
      fill.position.set(-2.5, 1.2, -1.5);
      scene.add(fill);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;

      const slot = {
        scene,
        camera,
        renderer,
        controls,
        raf: 0,
        ro: null,
        frustumHeight: 1,
        baseRadius: 1,
        ready: false,
        label: "morph",
      };
      viewers.push(slot);

      statusEl.textContent = "加载欧版…";
      const loader = makeGltfLoader();
      loader.load(
        euroGlbUrl(),
        async (gltf) => {
          const root = gltf.scene || gltf.scenes[0];
          root.traverse((obj) => {
            if (!obj.isMesh || !obj.material) return;
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            for (const mat of mats) {
              if (!mat) continue;
              if ("metalness" in mat) mat.metalness = 0;
              if ("roughness" in mat) mat.roughness = Math.max(Number(mat.roughness) || 0.5, 0.48);
              mat.needsUpdate = true;
            }
          });
          scene.add(root);
          const fit = fitCamera(camera, controls, root, host);
          slot.frustumHeight = fit.frustumHeight;
          slot.baseRadius = fit.baseRadius;
          slot.ready = true;
          try {
            await boneMorph.attach({
              root,
              scene,
              camera,
              domElement: renderer.domElement,
              controls,
              onChange: () => {
                requestAnimationFrame(() => patchMorphPanel());
              },
            });
            window.__boneMorph = boneMorph;
            statusEl.textContent = "骨相拧形 · 拖点/滑块 · 欧版";
            fillMorphPanel();
          } catch (e) {
            console.error(e);
            statusEl.textContent = "拧形初始化失败：" + e.message;
          }
        },
        undefined,
        (err) => {
          console.error(err);
          statusEl.textContent = "欧版加载失败";
        }
      );

      const tick = () => {
        slot.raf = requestAnimationFrame(tick);
        controls.update();
        renderer.render(scene, camera);
      };
      const ro = new ResizeObserver(() => {
        const nw = host.clientWidth;
        const nh = host.clientHeight;
        if (nw < 2 || nh < 2) return;
        const a = nw / nh;
        const fh = slot.frustumHeight || 1;
        camera.left = (-fh * a) / 2;
        camera.right = (fh * a) / 2;
        camera.top = fh / 2;
        camera.bottom = -fh / 2;
        camera.updateProjectionMatrix();
        renderer.setSize(nw, nh, false);
      });
      ro.observe(host);
      slot.ro = ro;
      tick();
      return slot;
    }

    function fitCamera(camera, controls, object, host) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z, 1e-6);
      const aspect = Math.max((host.clientWidth || 800) / Math.max(host.clientHeight || 560, 1), 1e-6);
      const padding = 1.12;
      const frustumHeight = maxDim * padding;
      camera.left = (-frustumHeight * aspect) / 2;
      camera.right = (frustumHeight * aspect) / 2;
      camera.top = frustumHeight / 2;
      camera.bottom = -frustumHeight / 2;
      camera.near = -maxDim * 30;
      camera.far = maxDim * 30;
      camera.zoom = 1;
      camera.position.set(center.x, center.y, center.z + maxDim * 3);
      camera.lookAt(center);
      camera.updateProjectionMatrix();
      controls.target.copy(center);
      controls.update();
      return { frustumHeight, baseRadius: maxDim * 3 };
    }

    function applyOrbitFrom(source, target) {
      if (!source || !target || !source.ready || !target.ready) return;
      const offset = new THREE.Vector3().subVectors(source.camera.position, source.controls.target);
      const sph = new THREE.Spherical().setFromVector3(offset);
      const radius = target.baseRadius || sph.radius;
      const next = new THREE.Vector3().setFromSpherical(
        new THREE.Spherical(radius, sph.phi, sph.theta)
      );
      target.camera.position.copy(target.controls.target).add(next);
      target.camera.zoom = source.camera.zoom;
      target.camera.up.copy(source.camera.up);
      target.camera.updateProjectionMatrix();
      target.camera.lookAt(target.controls.target);
      target.controls.update();
    }

    function bindOrbitSync(slot) {
      slot.controls.addEventListener("change", () => {
        if (syncingOrbit || !slot.ready) return;
        syncingOrbit = true;
        for (const other of viewers) {
          if (other === slot) continue;
          applyOrbitFrom(slot, other);
        }
        syncingOrbit = false;
      });
    }

    function initViewer(host, statusEl, url, label) {
      const w = host.clientWidth || 800;
      const h = host.clientHeight || 560;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);
      const aspect = w / Math.max(h, 1);
      const camera = new THREE.OrthographicCamera(-aspect, aspect, 1, -1, -1000, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.LinearToneMapping;
      renderer.toneMappingExposure = 1.35;
      host.innerHTML = "";
      host.appendChild(renderer.domElement);
      if (statusEl) host.appendChild(statusEl);

      const hemi = new THREE.HemisphereLight(0xffffff, 0xd0d0d0, 1.35);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xffffff, 1.25);
      dir.position.set(2.2, 3.5, 2.8);
      scene.add(dir);
      const fill = new THREE.DirectionalLight(0xffffff, 0.70);
      fill.position.set(-2.5, 1.2, -1.5);
      scene.add(fill);
      const front = new THREE.DirectionalLight(0xffffff, 0.55);
      front.position.set(0.2, 1.4, 4.0);
      scene.add(front);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;

      const slot = {
        scene,
        camera,
        renderer,
        controls,
        raf: 0,
        ro: null,
        frustumHeight: 1,
        baseRadius: 1,
        ready: false,
        label,
      };
      viewers.push(slot);
      bindOrbitSync(slot);

      const loader = makeGltfLoader();
      statusEl.textContent = "加载中… " + url;
      loader.load(
        url,
        (gltf) => {
          const root = gltf.scene || gltf.scenes[0];
          root.traverse((obj) => {
            if (!obj.isMesh || !obj.material) return;
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            for (const mat of mats) {
              if (!mat) continue;
              if ("metalness" in mat) mat.metalness = 0;
              if ("roughness" in mat) mat.roughness = Math.max(Number(mat.roughness) || 0.5, 0.48);
              mat.needsUpdate = true;
            }
          });
          scene.add(root);
          const fit = fitCamera(camera, controls, root, host);
          slot.frustumHeight = fit.frustumHeight;
          slot.baseRadius = fit.baseRadius;
          slot.ready = true;
          statusEl.textContent = "正交 · 白底 · 拖拽旋转 · " + label;
          // If peer already ready, match its orbit so both open with the same view.
          const peer = viewers.find((v) => v !== slot && v.ready);
          if (peer) applyOrbitFrom(peer, slot);
        },
        undefined,
        (err) => {
          console.error(label, url, err);
          statusEl.textContent = "加载失败：" + label + "（见控制台）";
        }
      );

      const tick = () => {
        slot.raf = requestAnimationFrame(tick);
        controls.update();
        renderer.render(scene, camera);
      };

      const ro = new ResizeObserver(() => {
        const nw = host.clientWidth;
        const nh = host.clientHeight;
        if (nw < 2 || nh < 2) return;
        const a = nw / nh;
        const fh = slot.frustumHeight || 1;
        camera.left = (-fh * a) / 2;
        camera.right = (fh * a) / 2;
        camera.top = fh / 2;
        camera.bottom = -fh / 2;
        camera.updateProjectionMatrix();
        renderer.setSize(nw, nh, false);
      });
      ro.observe(host);
      slot.ro = ro;
      tick();
      return slot;
    }

    async function render() {
      alignCache.clear();
      const ref = baseUrl(viewId);
      const ours = oursUrl(candId, viewId);
      const vLabel = (VIEWS.find((v) => v.id === viewId) || {}).label || viewId;
      elNote.textContent = `当前：${candId} · ${
        mode === "viewer3d" ? "3D GLB" : mode === "morph" ? "骨相拧形" : vLabel
      }。${currentNote()}`;

      if (mode === "morph") {
        clearAlignObservers();
        morphPanelDelegated = false;
        morphPanelPickToken = "";
        elStage.className = "stage morph";
        const refView = ["front", "side", "back"].includes(viewId) ? viewId : "side";
        elStage.innerHTML = `
          <div class="card">
            <h2>Base15 对照 <span>${refView}</span></h2>
            <div class="morph-ref-frame" id="morphBaseFrame"></div>
          </div>
          <div class="card">
            <h2>欧版 · 可拧 <span>euro_ref · Farkas / TPS</span></h2>
            <div class="viewer-host" id="viewerHostMorph"><div class="viewer-status" id="viewerStatusMorph"></div></div>
          </div>
          <div class="morph-panel" id="morphPanel"><p class="lm-stat">加载中…</p></div>`;
        elHint.textContent = viewHint();
        disposeViewer();
        mountMorphBaseRef();
        initMorphViewer(
          document.getElementById("viewerHostMorph"),
          document.getElementById("viewerStatusMorph")
        );
        return;
      }

      if (mode === "viewer3d") {
        clearAlignObservers();
        elStage.className = "stage viewer3d";
        const ok = hasGlb(candId);
        elStage.innerHTML = `
          <div class="card">
            <h2>欧版参考 <span>参考用_欧洲人头部肌肉… · 正交</span></h2>
            <div class="viewer-host" id="viewerHostEuro"><div class="viewer-status" id="viewerStatusEuro"></div></div>
          </div>
          <div class="card">
            <h2>当前成果 <span>${candId}${ok ? ".glb" : "（无 GLB）"} · 正交</span></h2>
            <div class="viewer-host" id="viewerHostOurs"><div class="viewer-status" id="viewerStatusOurs"></div></div>
          </div>`;
        elHint.textContent = viewHint() || (ok
          ? "左右双 3D：左欧版 / 右当前候选。拖拽任一侧，另一侧视角联动。"
          : "左侧为欧版参考；右侧候选未导出 GLB。");
        disposeViewer();
        initViewer(
          document.getElementById("viewerHostEuro"),
          document.getElementById("viewerStatusEuro"),
          euroGlbUrl(),
          "欧版"
        );
        if (ok) {
          initViewer(
            document.getElementById("viewerHostOurs"),
            document.getElementById("viewerStatusOurs"),
            glbUrl(candId),
            candId
          );
        } else {
          document.getElementById("viewerStatusOurs").textContent = "该候选未导出 GLB。";
        }
        return;
      }

      disposeViewer();
      clearAlignObservers();
      elStage.className = "stage " + (mode === "stack" ? "stack" : mode === "side" ? "side" : "stack");

      if (mode === "slider") {
        elStage.innerHTML = `
          <div class="card">
            <h2>拖拽对照 <span>左半 Base15 · 右半 我们的 · 同尺度对齐</span></h2>
            <div class="slider-wrap" id="slider">
              <div class="layer" id="layerOurs"></div>
              <div class="layer top" id="layerBase"></div>
              <div class="handle" id="handle"></div>
            </div>
          </div>`;
        elHint.textContent = viewHint() || "头顶/下巴已按 Base15 尺度对齐；按住中间线左右拖动看轮廓差。";
        try {
          const pair = await getAlignPair(ref, ours);
          mountAlignedFrame(document.getElementById("layerBase"), pair.baseImg, pair.baseBox, pair.refBox);
          mountAlignedFrame(document.getElementById("layerOurs"), pair.oursImg, pair.oursBox, pair.refBox);
          setupSlider();
        } catch (err) {
          console.error(err);
          elHint.textContent = "图片加载失败，请确认已生成正交截图。";
        }
        return;
      }

      elStage.innerHTML = `
        <div class="card">
          <h2>Base15 <span>${vLabel}</span></h2>
          <div class="frame" id="frameBase" data-label="Base15"></div>
        </div>
        <div class="card">
          <h2>${candId} <span>${vLabel}</span></h2>
          <div class="frame" id="frameOurs" data-label="${candId}"></div>
        </div>`;
      elHint.textContent = viewHint() || (mode === "side"
        ? "左右并排：同一显示尺度（头顶/下巴对齐 Base15），便于直接比轮廓与比例。"
        : "上下排列，同一显示尺度。");
      try {
        const pair = await getAlignPair(ref, ours);
        mountAlignedFrame(document.getElementById("frameBase"), pair.baseImg, pair.baseBox, pair.refBox);
        mountAlignedFrame(document.getElementById("frameOurs"), pair.oursImg, pair.oursBox, pair.refBox);
        if (lmActive) {
          await mountLandmarks();
        }
      } catch (err) {
        console.error(err);
        elHint.textContent = "图片加载失败，请确认已生成正交截图。";
      }
    }

    async function mountLandmarks() {
      const frameBase = document.getElementById("frameBase");
      const frameOurs = document.getElementById("frameOurs");
      if (!frameBase || !frameOurs) return;
      const camMetaUrl = `ours/${candId}/camera_meta.json?v=${assetRev || Date.now()}`;
      await lmc.mountOverlay({ frameBase, frameOurs, candId, viewId, camMetaUrl });
    }

    function setupSlider() {
      const wrap = document.getElementById("slider");
      const topLayer = document.getElementById("layerBase");
      const handle = document.getElementById("handle");
      if (!wrap || !topLayer) return;
      const setX = (clientX) => {
        const r = wrap.getBoundingClientRect();
        let t = (clientX - r.left) / r.width;
        t = Math.max(0.02, Math.min(0.98, t));
        topLayer.style.clipPath = `inset(0 ${(1 - t) * 100}% 0 0)`;
        handle.style.left = `${t * 100}%`;
      };
      const onMove = (e) => {
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        setX(x);
      };
      const stop = () => {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", stop);
        window.removeEventListener("touchmove", onMove);
        window.removeEventListener("touchend", stop);
      };
      wrap.addEventListener("pointerdown", (e) => {
        setX(e.clientX);
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", stop);
      });
      wrap.addEventListener("touchstart", (e) => {
        setX(e.touches[0].clientX);
        window.addEventListener("touchmove", onMove, { passive: true });
        window.addEventListener("touchend", stop);
      }, { passive: true });
    }

    elCand.addEventListener("change", () => {
      candId = elCand.value;
      render();
    });
    elViews.addEventListener("click", (e) => {
      const b = e.target.closest("[data-view]");
      if (!b) return;
      viewId = b.getAttribute("data-view");
      fillControls();
      if (mode === "morph") {
        mountMorphBaseRef();
        const h2 = elStage.querySelector(".card:nth-child(1) h2 span");
        if (h2) {
          const refView = ["front", "side", "back"].includes(viewId) ? viewId : "side";
          h2.textContent = refView;
        }
        return;
      }
      if (mode !== "viewer3d") render();
      else fillControls();
    });
    document.querySelectorAll(".mode-bar button[data-mode]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".mode-bar button[data-mode]").forEach((x) => x.classList.remove("active"));
        btn.classList.add("active");
        mode = btn.getAttribute("data-mode");
        render();
      });
    });

    const lmToggleBtn = document.getElementById("lmToggle");
    lmToggleBtn.addEventListener("click", async () => {
      lmActive = !lmActive;
      lmToggleBtn.classList.toggle("active", lmActive);
      lmToggleBtn.textContent = lmActive ? "锚点叠层 ✓" : "锚点叠层 ⊕";
      if (lmActive) {
        await mountLandmarks();
      } else {
        lmc.clearOverlays();
      }
    });

    fetch(`manifest.json?_=${Date.now()}`)
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        if (data && Array.isArray(data.candidates) && data.candidates.length) {
          cands = data.candidates.map((c) => ({
            ...c,
            glb: typeof c.glb === "boolean" ? c.glb : GLB_CANDS.has(c.id),
          }));
          const prefer =
            cands.find((c) => c.id === data.default_review) ||
            cands.find((c) => c.id === data.stage) ||
            cands[0];
          candId = prefer.id;
          assetRev = data.asset_rev || "";
        }
      })
      .catch(() => {})
      .finally(() => {
        fillControls();
        render();
      });
  </script>
</body>
