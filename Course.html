  <style>
    :root {
      --bg: #0c0c10;
      --text: #f4f1ea;
      --muted: #a39e96;
      --accent: #d4b56a;
      --accent-soft: rgba(212, 181, 106, 0.55);
      --line: rgba(255,255,255,0.08);
      --paper: #f7f3ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:

    a.back { color: var(--muted); text-decoration: none; font-size: 0.9rem; }

    .shot {
      margin: 0 0 16px;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #15131a;
      box-shadow:
        0 18px 40px rgba(0,0,0,0.35),
        0 0 0 1px rgba(255,255,255,0.06);
      opacity: 0;
      transform: translateY(14px);
      animation: riseIn 0.9s ease forwards;
    }
    .shot:nth-of-type(1) { animation-delay: 0.08s; }
    .shot:nth-of-type(2) { animation-delay: 0.22s; }
    .shot::after {
      content: "";
      position: absolute; inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      /* 柔化白底拼图与深色页的硬切边 */
      background:
        linear-gradient(180deg, rgba(12,12,16,0.18) 0%, transparent 12%, transparent 88%, rgba(12,12,16,0.22) 100%),
        radial-gradient(120% 90% at 50% 50%, transparent 62%, rgba(12,12,16,0.28) 100%);
    }
    .shot img {
      display: block; width: 100%; height: auto;
      background: var(--paper);
    }
    @keyframes riseIn {
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .shot { opacity: 1; transform: none; animation: none; }
      .works-actions a.more .more-arrows { transition: none; }
    }

    .works-actions {
      display: flex; justify-content: flex-end;
      margin: 4px 0 0;
    }
    .works-actions a.more {
      display: inline-flex; align-items: center;
      text-decoration: none; font-weight: 600; font-size: 0.93rem;
      padding: 11px 16px; border-radius: 999px;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.03);
      gap: 0.28em;
      transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
    }
    .works-actions a.more .more-arrows {
      display: inline-block;
      letter-spacing: -0.08em;
      margin-left: 0.06em;
      font-weight: 500;
      transition: transform 0.25s ease;
    }
    .works-actions a.more:hover {
      border-color: var(--accent-soft);
      color: var(--accent);
      background: rgba(212, 181, 106, 0.06);
    }
    .works-actions a.more:hover .more-arrows {
      transform: translateX(3px);
    }

    .facts {
      display: grid;
      gap: 18px;
      margin: 0 0 28px;
      padding: 4px 0 2px;
    }
    .fact {
      padding: 4px 0 4px 16px;
      border-left: 2px solid rgba(212, 181, 106, 0.45);
    }
    .fact h2 {
      margin: 0 0 8px;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    .fact p {
      margin: 0 0 8px;
      color: rgba(244, 241, 234, 0.88);
      font-size: 0.94rem;
    }
    .fact p:last-child { margin-bottom: 0; }
    .fact .muted { color: var(--muted); font-size: 0.9rem; }

    .cta-row {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin: 16px 0 0;
    }
    .cta-row a {
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none; font-weight: 650; font-size: 0.93rem;
      padding: 12px 18px; border-radius: 8px;
    }
    .cta-row a.primary {
      background: var(--accent); color: #1a1408;
    }
    .cta-row a.ghost {

    }
    .cta-row a.ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
    .cta-row a.is-disabled,
    .cta-row span.is-disabled {
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 650; font-size: 0.93rem;
      padding: 12px 18px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.10);
      color: rgba(163, 158, 150, 0.75);
      background: rgba(255,255,255,0.02);
      cursor: default;
      user-select: none;
    }

    .entry {
      margin: 8px 0 8px;
      padding: 18px 0 4px;
      border-top: 1px solid var(--line);
    }
    .entry h2 {
      margin: 0 0 8px;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    .entry .entry-lead {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
      max-width: 34em;
    }

    .note {
      font-size: 0.8rem;
      color: rgba(163, 158, 150, 0.85);
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div id="menu-trigger" class="absolute" onclick="typeof toggleMenu==='function'&&toggleMenu()" aria-label="打开菜单" style="position:fixed;top:24px;right:24px;width:44px;height:44px;z-index:50;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;">
    <span style="display:block;width:28px;height:1.5px;background:#fff;margin:3.5px 0;border-radius:1px;"></span>
    <span style="display:block;width:20px;height:1.5px;background:#fff;margin:3.5px 0;border-radius:1px;"></span>
    <span style="display:block;width:28px;height:1.5px;background:#fff;margin:3.5px 0;border-radius:1px;"></span>
  </div>
  <main>
    <p><a class="back" href="#" id="btn-back">← 返回</a></p>
    <p class="brand">童画师吴晓 · 水彩儿童肖像</p>
    <h1>水彩肖像画课程 · 预告</h1>
    <p class="lead">正式预约尚未开放。先看看作品气质是否符合你的期待；课程开放时，我们会再更新本页。</p>

    <section class="works" aria-label="课程相关作品">
      <div class="works-head">
        <h2>作品选看</h2>
        <p>先感受这一路水彩儿童肖像的气息与分寸。</p>
      </div>
      <figure class="shot">
        <img
          src="/docs/img/course/01.webp"
          width="1348"
          height="764"
          alt="童画师吴晓与水彩儿童肖像作品合集"
          loading="eager"
          decoding="async"
        >
      </figure>
      <figure class="shot">
        <img
          src="/docs/img/course/02.webp"
          width="1348"
          height="1013"
          alt="水彩儿童肖像圆形作品墙"
          loading="lazy"
          decoding="async"
        >
      </figure>
      <div class="works-actions">
        <a class="more" href="/Gallery">更多作品<span class="more-arrows" aria-hidden="true">››</span></a>
      </div>
    </section>

    <section class="facts" aria-label="课程要点">
      <div class="fact">
        <h2>上线时间</h2>
        <p>2027 年第一季度内，童画师将推出其精心打磨了三年的水彩肖像画课程。</p>
      </div>
      <div class="fact">
        <h2>高级会员优惠</h2>
        <p>届时成为学员的高级会员，可从课程定价中减免高级会员订阅费用。</p>
        <p class="muted">也就是说：先开通站内高级会员，学课时可按规则抵扣已付的高级会员费用。</p>
        <div class="cta-row">
          <a class="primary" href="/member#course-preview">查看会员权益</a>
        </div>
      </div>
    </section>

    <!-- 学习入口：仅测站/本机挂上；正式站录播未开放前不得露出（见路线图 §4.5.2） -->
    <section class="entry" id="course-entry" aria-label="学习入口" hidden>
      <h2>学习入口</h2>
      <p class="entry-lead" id="entry-lead">正在确认你的开通状态…</p>
      <div class="cta-row" id="course-entry-ctas"></div>
    </section>

    <p class="note" id="course-page-note">本页仅为预告，暂不支持在线预约或付款报名。开放购课与看课后，本页会更新说明。</p>
  </main>
  <script>
    (function () {
      var COURSE_PACK_ID = 'watercolor-portrait-demo';

      function hostAllowsLearnUi() {
        var h = String(location.hostname || '').toLowerCase();
        return (
          h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' ||
          h === 'test.wuxiaoart.com' || h.indexOf('soft-voice-f822-staging') >= 0 ||
          /^(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h)
        );
      }
      function isLocalDevHost() {
        var h = String(location.hostname || '').toLowerCase();
        if (h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0') return true;
        return /^(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h);
      }

      // 正式站：整段拔掉，避免 hidden 仍留在 DOM / 文案提示「学习入口」
      (function stripLearnEntryOnProd() {
        if (hostAllowsLearnUi()) return;
        var section = document.getElementById('course-entry');
        if (section && section.parentNode) section.parentNode.removeChild(section);
      })();
      function packsInclude(packs, packId) {
        if (!Array.isArray(packs)) return false;
        var i;
        for (i = 0; i < packs.length; i++) {
          if (packs[i] && String(packs[i].packId || '') === packId) return true;
        }
        return false;
      }
      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text) n.textContent = text;
        return n;
      }
      function linkBtn(cls, href, text) {
        var a = el('a', cls, text);
        a.href = href;
        return a;
      }
      function disabledChip(text) {
        return el('span', 'is-disabled', text);
      }

      // 测站/本地：显示学习入口；正式站录播未开放前不挂入口（也不保留区块）
      (function paintCourseEntry() {
        var section = document.getElementById('course-entry');
        var lead = document.getElementById('entry-lead');
        var row = document.getElementById('course-entry-ctas');
        var note = document.getElementById('course-page-note');
        if (!hostAllowsLearnUi()) return;
        if (!section || !lead || !row) return;
        section.hidden = false;
        if (note) {
          note.textContent =
            '本页仅为预告，暂不支持在线预约或付款报名。购课通道开放后，会在上方「学习入口」出现明确按钮。';
        }

        function paint(state) {
          row.innerHTML = '';
          if (state === 'has_pack' || state === 'local_bypass') {
            lead.textContent =
              state === 'local_bypass'
                ? '本机开发环境可直接进入学习页。正式学员须开通课包后，才会看到「进入课堂」。'
                : '你已开通本课。点下方进入学习页看课。';
            row.appendChild(linkBtn('primary', '/CourseLearn', '进入课堂'));
            row.appendChild(linkBtn('ghost', '/member', '会员中心'));
            return;
          }
          if (state === 'need_login') {
            lead.textContent =
              '看课前请先登录。若已购课，登录后本页会出现「进入课堂」；尚未购课可先了解会员权益，购课通道仍在筹备。';
            row.appendChild(
              linkBtn('primary', '/member?return=' + encodeURIComponent('/Course'), '登录后看课')
            );
            row.appendChild(disabledChip('购课通道筹备中'));
            return;
          }
          // logged in, no pack
          lead.textContent =
            '当前账号尚未开通本课。请联系运营开通（报手机号 + 课包意向）。在线购课通道仍在筹备，开通后本页会变为「进入课堂」。';
          row.appendChild(linkBtn('primary', '/member#course-preview', '申请开通本课'));
          row.appendChild(disabledChip('购课通道筹备中'));
        }

        if (isLocalDevHost()) {
          paint('local_bypass');
          return;
        }

        fetch('/api/membership/me', { credentials: 'same-origin', cache: 'no-store' })
          .then(function (res) {
            return res.json().then(function (body) {
              return body || {};
            });
          })
          .then(function (body) {
            var level = body.accessLevel || 'guest';
            if (level !== 'user' && level !== 'member') {
              paint('need_login');
              return;
            }
            if (packsInclude(body.coursePacks, COURSE_PACK_ID)) paint('has_pack');
            else paint('need_pack');
          })
          .catch(function () {
            paint('need_login');
          });
      })();

      var btn = document.getElementById('btn-back');
      if (!btn) return;

      function resolveReturnTarget() {
        try {
          var u = new URL(location.href);
          var ret = u.searchParams.get('return');
          if (ret && ret.charAt(0) === '/' && ret.charAt(1) !== '/' && ret.indexOf('/Course') !== 0) {
            return ret;
          }
        } catch (_e) {}
        return null;
      }

      function sameOriginReferrer() {
        try {
          if (!document.referrer) return false;
          var r = new URL(document.referrer);
          return r.origin === location.origin;
        } catch (_e2) {
          return false;
        }
      }

      function canGoBack() {
        if (resolveReturnTarget()) return true;
        if (sameOriginReferrer()) return true;
        try {
          var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
          if (nav && nav.type === 'back_forward') return true;
        } catch (_e3) {}
        return false;
      }

      if (!canGoBack()) {
        btn.hidden = true;
        return;
      }

      btn.addEventListener('click', function (e) {
        e.preventDefault();
        var ret = resolveReturnTarget();
        if (ret) {
          location.replace(ret);
          return;
        }
        // 从全局菜单进来时，历史里通常留有上一页+#menu；back 会回到菜单开着的状态
        try {
          history.back();
        } catch (_e4) {}
      });
    })();
  </script>
</body>
